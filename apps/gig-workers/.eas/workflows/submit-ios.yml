
name: Submit iOS App

# Manual-only until store submission is configured.
#
# eas.json has `submit.production: {}` — no ascAppId/appleTeamId for iOS, no
# serviceAccountKeyPath/track for Android — so this job cannot succeed. It was
# also triggered on pushes to `main` while the default branch is `master`, so it
# never actually ran and the breakage stayed invisible.
#
# Before restoring `on: push`: fill in eas.json submit.production, then
# run manually once to verify: eas workflow:run submit-ios.yml

jobs:
  submit_ios:
    name: Submit iOS
    type: submit
    params:
      platform: ios
      profile: production
