name: Schema Drift Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        # --frozen-lockfile to match ci.yml. A plain `bun install` re-resolves
        # and re-fetches, which kept failing on the xlsx tarball (0.18.5 is the
        # last SheetJS release published to npm and its tarball is unreliable).
        run: bun install --frozen-lockfile

      - name: Generate Migrations
        # The script is `db:generate`; calling `generate` made this step fail on
        # a missing script every run, so drift was never actually checked.
        run: bun run --filter @repo/database db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # BLOCKING again as of 2026-08-07. The journal/snapshot divergence that
      # forced this to warning-only is reconciled: drizzle/ now holds a single
      # 0000_baseline verified to reproduce production exactly, and production's
      # __drizzle_migrations holds the one matching row. `db:generate` against a
      # clean tree is now a genuine no-op, so anything this step reports is drift
      # the PR actually introduced.
      - name: Check for Changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "::error title=Schema drift detected::schema.ts does not match the committed migrations. Run 'bun run --filter @repo/database db:generate' and commit the generated migration."
            git status
            git diff
            exit 1
          else
            echo "No schema drift."
          fi
