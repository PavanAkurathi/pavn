name: Schema Drift Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Generate Migrations
        # The script is `db:generate`; calling `generate` made this step fail on
        # a missing script every run, so drift was never actually checked.
        run: bun run --filter @repo/database db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Check for Changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Schema drift detected! Run 'bun run --filter @repo/database db:generate' and commit the result."
            git status
            git diff
            exit 1
          fi
