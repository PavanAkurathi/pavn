name: CI

on:
  push:
    # The default branch is `master`. This previously listed only `main`, so no
    # push to the actual development branch ever triggered CI.
    branches: ["main", "master"]
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type Check
        run: bun run check-types

      - name: Test
        run: bun run test

      # `bun run build` only bundles the API (it is Vercel's deploy contract).
      # build:all runs turbo across api + web + docs so a broken Next build is
      # caught here rather than at deploy time.
      - name: Build
        run: bun run build:all
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:4005
          NEXT_PUBLIC_AUTH_URL: http://localhost:4005
          BETTER_AUTH_URL: http://localhost:4005
          BETTER_AUTH_SECRET: ci-build-placeholder-secret-not-used-at-runtime
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Opt-in: set repository variable RUN_E2E=true once the secrets below exist.
    # Playwright boots apps/api + apps/web and needs a real database, so it
    # cannot share the unit-test job.
    if: vars.RUN_E2E == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E
        run: bun run test:e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost:4005
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:4005
          MOCK_EMAIL: "true"
          MOCK_SMS: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 7
