var aff=affectedShifts(r.who,r.day);
rh+='<div class="sx-req"><div class="rh"><div class="sx-av" style="background:'+roleColor(roleOf(r.who))+'">'+initials(r.who)+'</div><div class="rt">'+esc(r.who)+' · '+esc(r.when)+'</div></div><div class="rd">Reason: '+esc(r.reason)+(aff?' · <b style="color:#ef4444">'+aff+' shift'+(aff>1?'s':'')+' scheduled that day</b>':'')+'</div>';
if(r.status==="pending"){rh+='<div class="ractions"><button class="sx-btn sx-approve" data-action="req" data-kind="timeOff" data-id="'+r.id+'" data-dec="approve">Approve</button><button class="sx-btn sx-deny" data-action="req" data-kind="timeOff" data-id="'+r.id+'" data-dec="deny">Deny</button></div>';}
else{rh+='<div class="sx-decided '+(r.status==="approved"?'ok':'no')+'">'+(r.status==="approved"?"Approved — "+esc(r.who)+" notified by SMS":"Denied")+'</div>';}
rh+='</div>';
});
rh+='<div class="sx-sect">Shift swaps</div>';
state.reqs.swaps.forEach(function(r){
rh+='<div class="sx-req"><div class="rh"><div class="sx-av" style="background:'+roleColor(roleOf(r.from))+'">'+initials(r.from)+'</div><div class="rt">'+esc(r.from)+' → '+esc(r.to)+'<div style="font-weight:400;font-size:12px;color:var(--hatch-widget-muted)">'+esc(r.what)+'</div></div></div>';
if(r.note)rh+='<div class="rnote">“'+esc(r.note)+'”</div>';
if(r.status==="pending"){rh+='<div class="ractions"><button class="sx-btn sx-approve" data-action="req" data-kind="swaps" data-id="'+r.id+'" data-dec="approve">Approve swap</button><button class="sx-btn sx-deny" data-action="req" data-kind="swaps" data-id="'+r.id+'" data-dec="deny">Deny</button></div>';}
else{rh+='<div class="sx-decided '+(r.status==="approved"?'ok':'no')+'">'+(r.status==="approved"?"Approved — schedule updated, both notified by SMS":"Denied")+'</div>';}
rh+='</div>';
});
rh+='</div>';
view.innerHTML=rh;
hint.innerHTML="<b>Try it:</b> approve Leo's swap and watch the Friday board update itself — no retyping needed.";
}
hidePop();
}
function roleOf(name){for(var i=0;i<state.team.length;i++)if(state.team[i].name===name)return state.team[i].role;return"Server";}
function boardHTML(){
var shifts=cur(),conf=conflicts(shifts);
var mo=monday(state.weekOffset),ds=[];
for(var d=0;d<7;d++){var dt=new Date(mo);dt.setDate(dt.getDate()+d);ds.push(dt);}
var today=new Date(2026,9,3),tIdx=-1;
ds.forEach(function(dt,i){if(dt.getFullYear()===today.getFullYear()&&dt.getMonth()===today.getMonth()&&dt.getDate()===today.getDate())tIdx=i;});
var g='<div class="sx-boardwrap"><div class="sx-board"><div class="sx-corner">Role</div>';
ds.forEach(function(dt,i){g+='<div class="sx-dayhead"><div class="d">'+DAYS[i]+'</div><div class="n">'+dt.getDate()+'</div></div>';});
ROLES.forEach(function(r){
var cnt=0;shifts.forEach(function(s){if(s.role===r.name)cnt++;});
g+='<div class="sx-role"><span class="sx-dot" style="background:'+r.color+'"></span>'+r.name+'<span class="sx-rcount">'+cnt+'</span></div>';
for(var dI=0;dI<7;dI++){
var cell=[];shifts.forEach(function(s){if(s.role===r.name&&s.day===dI)cell.push(s);});
g+='<div class="sx-cell" data-role="'+r.name+'" data-day="'+dI+'">';
cell.forEach(function(s){
var col=roleColor(s.role);
if(!s.employee){g+='<div class="sx-shift open'+(s.published?'':' draft')+'" data-id="'+s.id+'"><div class="nm">OPEN · tap to assign</div><div class="tm">'+fmt(s.start)+' – '+fmt(s.end)+'</div></div>';}
else{g+='<div class="sx-shift'+(conf[s.id]?' conflict':'')+(s.published?'':' draft')+'" draggable="true" data-id="'+s.id+'" style="background:'+col+'14;border-color:'+col+'66;border-left:3px solid '+col+'">'+(conf[s.id]?'<div class="sx-warn">!</div>':'')+'<div class="r1"><div class="mav" style="background:'+col+'">'+initials(s.employee)+'</div><div class="nm">'+esc(s.employee)+'</div></div><div class="tm">'+fmt(s.start)+' – '+fmt(s.end)+(s.published?'':' · draft')+'</div></div>';}
});
g+='</div>';
}
});
g+='</div></div>';
return g;
}
function attachBoard(){
var board=document.querySelector("#view .sx-board");
if(!board)return;
board.addEventListener("dragstart",function(e){var el=e.target.closest?e.target.closest(".sx-shift"):null;if(!el||el.classList.contains("open")){e.preventDefault();return;}e.dataTransfer.setData("text/plain",el.getAttribute("data-id"));e.dataTransfer.effectAllowed="move";});
board.addEventListener("dragover",function(e){var c=e.target.closest?e.target.closest(".sx-cell"):null;if(!c)return;e.preventDefault();c.classList.add("drop-hi");});
board.addEventListener("dragleave",function(e){var c=e.target.closest?e.target.closest(".sx-cell"):null;if(c)c.classList.remove("drop-hi");});
board.addEventListener("drop",function(e){var c=e.target.closest?e.target.closest(".sx-cell"):null;if(!c)return;e.preventDefault();var hs=board.querySelectorAll(".drop-hi");for(var k=0;k<hs.length;k++)hs[k].classList.remove("drop-hi");var id=e.dataTransfer.getData("text/plain");var shifts=cur();for(var i=0;i<shifts.length;i++){if(shifts[i].id===id){var s=shifts[i];s.day=+c.getAttribute("data-day");s.role=c.getAttribute("data-role");s.published=false;save();toast("Moved "+s.employee+" → "+DAYS[s.day]+" · "+s.role);return;}}});
board.addEventListener("click",function(e){var sh=e.target.closest?e.target.closest(".sx-shift"):null;if(sh){openShiftPop(sh.getAttribute("data-id"));return;}var c=e.target.closest?e.target.closest(".sx-cell"):null;if(c){openShiftPop(null,c.getAttribute("data-role"),+c.getAttribute("data-day"));}});
}
function openShiftPop(id,role,day){
var shifts=cur(),s=null,i,pop=document.getElementById("pop");
if(id){for(i=0;i<shifts.length;i++)if(shifts[i].id===id)s=shifts[i];if(!s)return;role=s.role;day=s.day;}
var activeMembers=state.team.filter(function(m){return m.status==="active";});
var opts='<option value="">— Leave open —</option>';
activeMembers.forEach(function(m){opts+='<option value="'+esc(m.name)+'"'+(s&&s.employee===m.name?' selected':'')+'>'+esc(m.name)+' ('+esc(m.role)+')</option>';});
pop.innerHTML='<h5>'+(s?"Edit shift":"New shift")+' · '+esc(role)+' · '+DAYS[day]+'</h5><label>Team member</label><select id="pp-emp">'+opts+'</select><div class="sx-prow"><div><label>Start</label><input type="time" id="pp-s" value="'+(s?s.start:"17:00")+'"></div><div><label>End</label><input type="time" id="pp-e" value="'+(s?s.end:"23:00")+'"></div></div><div class="sx-pactions"><button class="sx-btn sx-btn-pri" id="pp-save">'+(s?"Save":"Add shift")+'</button><button class="sx-btn" id="pp-cancel">Cancel</button></div>'+(s?'<button class="sx-del" id="pp-del">Delete shift</button>':'');
pop.style.display="block";
document.getElementById("pp-cancel").onclick=hidePop;
document.getElementById("pp-save").onclick=function(){
var emp=document.getElementById("pp-emp").value||null,st=document.getElementById("pp-s").value||"17:00",en=document.getElementById("pp-e").value||"23:00";
if(s){s.employee=emp;s.start=st;s.end=en;s.published=false;toast("Shift updated · draft");}
else{shifts.push({id:"s"+Date.now(),role:role,day:day,start:st,end:en,employee:emp,published:false});toast(emp?("Shift added for "+emp):"Open shift added");}
save();};
if(s){document.getElementById("pp-del").onclick=function(){var ix=shifts.indexOf(s);if(ix>-1)shifts.splice(ix,1);save();toast("Shift deleted");};}
}
function openInvitePop(){
var pop=document.getElementById("pop");
var ropts=ROLES.map(function(r){return '<option>'+r.name+'</option>';}).join("");
pop.innerHTML='<h5>Invite team member</h5><label>Name</label><input id="iv-name" placeholder="e.g. Casey L." style="width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--hatch-widget-border);background:var(--hatch-widget-bg);color:var(--hatch-widget-text);font-size:13px;font-family:inherit"><label>Phone number</label><input id="iv-phone" placeholder="(312) 555-0100" style="width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--hatch-widget-border);background:var(--hatch-widget-bg);color:var(--hatch-widget-text);font-size:13px;font-family:inherit"><label>Role</label><select id="iv-role">'+ropts+'</select><div class="sx-pactions"><button class="sx-btn sx-btn-pri" id="iv-save">Send SMS invite</button><button class="sx-btn" id="iv-cancel">Cancel</button></div><div style="font-size:11px;color:var(--hatch-widget-muted);margin-top:10px">No app download needed — they open the link and see their shifts.</div>';
pop.style.display="block";
document.getElementById("iv-cancel").onclick=hidePop;
document.getElementById("iv-save").onclick=function(){
var nm=document.getElementById("iv-name").value.trim(),ph=document.getElementById("iv-phone").value.trim(),rl=document.getElementById("iv-role").value;
if(!nm){toast("Add a name first");return;}
state.team.push({name:nm,role:rl,phone:ph||"—",status:"invited"});
save();toast("SMS invite sent to "+nm);
};
}
document.getElementById("sapp").addEventListener("click",function(e){
var el=e.target.closest?e.target.closest("[data-action]"):null;
if(!el)return;
var a=el.getAttribute("data-action");
if(a==="nav"){state.view=el.getAttribute("data-view");save();}
else if(a==="wprev"){state.weekOffset--;save();}
else if(a==="wnext"){state.weekOffset++;save();}
else if(a==="wtoday"){state.weekOffset=0;save();}
else if(a==="copyweek"){
var k=String(state.weekOffset),pk=String(state.weekOffset-1);
if(cur().length){toast("This week already has shifts");return;}
var prev=state.weeks[pk];
if(!prev||!prev.length){toast("No previous week to copy");return;}
state.weeks[k]=prev.map(function(s){return{id:"s"+Date.now()+Math.floor(Math.random()*1e6),role:s.role,day:s.day,start:s.start,end:s.end,employee:s.employee,published:false};});
save();toast("Copied "+prev.length+" shifts as drafts");
}
else if(a==="publish"){var n=0;cur().forEach(function(s){if(!s.published){s.published=true;n++;}});var ac=0;state.team.forEach(function(m){if(m.status==="active")ac++;});save();toast(n?("Published · "+ac+" teammates notified by SMS"):("Schedule is already published · "+ac+" on the team"));}
else if(a==="invite-open"){openInvitePop();}
else if(a==="req"){
var kind=el.getAttribute("data-kind"),id=el.getAttribute("data-id"),dec=el.getAttribute("data-dec");
var list=state.reqs[kind],r=null;
for(var i=0;i<list.length;i++)if(list[i].id===id)r=list[i];
if(!r)return;
r.status=dec==="approve"?"approved":"denied";
if(kind==="swaps"&&dec==="approve"){
var shifts=cur();
for(var j=0;j<shifts.length;j++){var s=shifts[j];if(s.employee===r.from&&s.day===r.day&&s.role===r.role){s.employee=r.to;s.published=false;break;}}
toast("Swap approved · schedule updated, both notified by SMS");
}else if(dec==="approve"){toast("Approved · "+r.who+" notified by SMS");}
else{toast("Denied");}
save();
}
});
if(bridge.onStateChange){bridge.onStateChange(function(ns){state=ns;render();});}
render();
})();
</script>
