<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style><title>Workers Hive Scheduler</title></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#F3F4F6; --surface-3:#E9ECF0;
  --text:#0D0D0D; --text-2:#334155; --muted:#64748B;
  --border:#E2E4E8; --border-strong:#C9D0DA;
  --primary:#D92B3A; --primary-hover:#BF2230; --primary-fg:#FFFFFF; --primary-soft:#FCE9EB;
  --ink:#141B2D; --ink-fg:#F8FAFC;
  --danger:#BF1111; --danger-soft:#FDECEC;
  --warn:#A34E05; --warn-strong:#D97706; --warn-soft:#FEF3C7;
  --ok:#047857; --ok-soft:#DCFCE7;
  --violet:#6D28D9; --violet-soft:#EDE9FE;
  --r-server:#fdba74; --r-bartender:#d8b4fe; --r-kitchen:#fda4af; --r-host:#6ee7b7; --r-support:#fde047; --r-default:#cbd5e1;
  --role-fg:#0D0D0D;
  --timeoff:#E8ECF2; --hatch:rgba(100,116,139,.16);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --shadow-lg:0 16px 40px rgba(16,24,40,.18),0 2px 6px rgba(16,24,40,.08);
  --scrim:rgba(15,23,42,.32);
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0E14; --surface:#131A2A; --surface-2:#182540; --surface-3:#1F2F50;
    --text:#F2F2F2; --text-2:#CBD5E1; --muted:#A1A1AA;
    --border:#22324F; --border-strong:#304468;
    --primary:#E0404E; --primary-hover:#EA5663; --primary-fg:#FFFFFF; --primary-soft:#3A1117;
    --ink:#F2F2F2; --ink-fg:#0D0D0D;
    --danger:#F87171; --danger-soft:#3B1215;
    --warn:#FBBF24; --warn-strong:#F59E0B; --warn-soft:#382A08;
    --ok:#34D399; --ok-soft:#0B2E22;
    --violet:#C4B5FD; --violet-soft:#2A2150;
    --r-server:#fb923c; --r-bartender:#c084fc; --r-kitchen:#fb7185; --r-host:#34d399; --r-support:#facc15; --r-default:#94a3b8;
    --timeoff:#1B263D; --hatch:rgba(148,163,184,.14);
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --shadow-lg:0 16px 40px rgba(0,0,0,.55);
    --scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0E14; --surface:#131A2A; --surface-2:#182540; --surface-3:#1F2F50;
  --text:#F2F2F2; --text-2:#CBD5E1; --muted:#A1A1AA;
  --border:#22324F; --border-strong:#304468;
  --primary:#E0404E; --primary-hover:#EA5663; --primary-fg:#FFFFFF; --primary-soft:#3A1117;
  --ink:#F2F2F2; --ink-fg:#0D0D0D;
  --danger:#F87171; --danger-soft:#3B1215;
  --warn:#FBBF24; --warn-strong:#F59E0B; --warn-soft:#382A08;
  --ok:#34D399; --ok-soft:#0B2E22;
  --violet:#C4B5FD; --violet-soft:#2A2150;
  --r-server:#fb923c; --r-bartender:#c084fc; --r-kitchen:#fb7185; --r-host:#34d399; --r-support:#facc15; --r-default:#94a3b8;
  --timeoff:#1B263D; --hatch:rgba(148,163,184,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-lg:0 16px 40px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
kbd{font:500 11px/1 var(--mono);padding:2px 5px;border-radius:4px;border:1px solid currentColor;opacity:.9}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* prototype strip */
.proto{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding-block:8px;padding-inline:16px;background:var(--ink);color:var(--ink-fg);font-size:12.5px}
.proto b{font-weight:600}
.proto ul{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0;padding:0;list-style:none;opacity:.88}

/* app nav */
.nav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;padding-inline:16px;max-width:1480px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.org{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--ink);color:var(--ink-fg);display:grid;place-items:center;font-weight:700;font-size:13px}
.org b{display:block;font-size:13.5px;line-height:1.1}
.org small{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:2px}
.tabs button{background:none;border:0;padding:17px 12px 15px;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;display:flex;gap:7px;align-items:center}
.tabs button:hover{color:var(--text)}
.tabs button[aria-current="page"]{color:var(--primary);border-bottom-color:var(--primary)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--primary);color:#fff;font-size:11px;font-weight:600;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.me{display:flex;gap:10px;align-items:center;font-size:13px}

main{max-width:1480px;margin:0 auto;padding-block:18px 48px;padding-inline:16px;display:flex;flex-direction:column;gap:12px}
@media (min-width:900px){main{padding-inline:24px}}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.toolbar h1{font-size:21px;font-weight:650;letter-spacing:-.015em;margin:0 6px 0 0}
.sel{height:36px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:0 10px;font-size:13.5px;font-weight:500}
.weeknav{display:flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:8px;background:var(--surface);height:36px;padding:0 2px}
.iconbtn{width:30px;height:30px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--text-2)}
.iconbtn:hover{background:var(--surface-2)}
.weeklabel{min-width:132px;text-align:center;font-weight:600;font-size:13.5px}
.btn{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.primary:disabled{background:var(--surface-2);border-color:var(--border);color:var(--muted);cursor:default}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--border))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.55;cursor:default}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);padding:2px;height:36px}
.seg button{border:0;background:none;padding:0 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.spacer{flex:1 1 0;min-width:0}
.tb-actions{display:flex;flex-wrap:wrap;gap:10px;margin-left:auto}

/* stats */
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:13px;margin:0}
.stat{display:flex;gap:6px;align-items:baseline}
.stat dt{color:var(--muted)}
.stat dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.stat .sub{font-weight:400;color:var(--muted);font-size:12px}
.stat.bad dt,.stat.bad dd{color:var(--danger)}
.stat.warn dd{color:var(--warn)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.search{height:32px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 10px;width:200px;max-width:100%}
.filters .sel{height:32px;font-weight:400}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2)}
.legend{margin-left:auto;display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:18px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--border-strong)}
.sw.pub{background:var(--r-server);border-color:color-mix(in srgb,var(--r-server) 70%,#000 15%)}
.sw.dr{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--r-server) 60%,var(--surface)) 0 4px,var(--surface) 4px 8px);border-style:dashed;border-color:color-mix(in srgb,var(--r-server) 70%,#000 20%)}
.sw.ch{background:var(--r-server);position:relative}
.sw.ch::after{content:"";position:absolute;right:-3px;bottom:-3px;width:7px;height:7px;border-radius:50%;background:var(--warn-strong);border:1.5px solid var(--surface)}
.sw.to{background:var(--timeoff)}
.sw.fl{width:14px;height:14px;border-radius:50%;background:var(--danger);border:0;color:#fff;font-size:10px;font-weight:800;display:inline-grid;place-items:center}

/* empty week strip */
.emptyw{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding:12px 14px;border:1px dashed var(--border-strong);border-radius:10px;background:var(--surface)}
.emptyw p{margin:0 8px 0 0;font-weight:500}

/* grid */
.gwrap{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:auto;max-height:calc(100vh - 140px);min-height:340px;box-shadow:var(--shadow);overscroll-behavior:contain}
.grid{display:grid;grid-template-columns:212px repeat(7,minmax(122px,1fr)) 96px;min-width:1162px;width:100%}
.gh{position:sticky;top:0;z-index:6;background:var(--surface-2);border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:7px 10px;display:flex;flex-direction:column;justify-content:center;gap:1px;font-size:12px;min-height:50px}
.gh-r1{display:flex;align-items:baseline;gap:6px}
.gh-r2{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.gh .dn{font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-size:11px}
.gh .dd{font-weight:650;font-size:13.5px;font-variant-numeric:tabular-nums}
.gh.today{box-shadow:inset 0 -2px 0 var(--primary)}
.gh.today .dd{color:var(--primary)}
.gh .dopen{margin-left:auto;font-size:11px;font-weight:600;color:var(--danger);white-space:nowrap}
.gh.corner{left:0;z-index:8;align-items:flex-start}
.gh.corner b{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.gh.wkh{border-right:0;align-items:flex-end}
.gh.wkh .dn{font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-size:11px}
.lab{position:sticky;left:0;z-index:4;background:var(--surface);border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:7px 10px;display:flex;align-items:center;gap:9px;min-width:0}
.lab .nmw{min-width:0;display:flex;flex-direction:column}
.lab .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab .meta{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:5px;align-items:center}
.lab.sys{background:var(--surface-2)}
.lab.sys .nm{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-2)}
.tag{font-size:10.5px;font-weight:600;padding:0 6px;border-radius:999px;line-height:16px;border:1px solid}
.tag.inv{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)}
.tag.ag{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 35%,transparent);background:var(--violet-soft)}
.av{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:650;background:var(--surface-3);color:var(--text-2)}
.av.inv{box-shadow:0 0 0 2px var(--warn-strong)}
.av.ag{box-shadow:0 0 0 2px var(--violet)}
.grp{grid-column:1/-1;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:5px 10px;display:flex}
.grp span{position:sticky;left:10px;display:inline-flex;gap:7px;align-items:center}
.rdot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--rc);border:1px solid color-mix(in srgb,var(--rc) 70%,#000 25%)}
.c{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:5px;min-height:58px;display:flex;flex-direction:column;gap:4px;position:relative;background:var(--surface);outline:none;cursor:cell}
.c:focus-visible,.c.kfocus:focus{box-shadow:inset 0 0 0 2px var(--primary)}
.c.sys{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.c.wkc{border-right:0;align-items:flex-end;justify-content:center;font-variant-numeric:tabular-nums;padding:6px 10px;cursor:default;gap:1px}
.wkc .h{font-weight:650;font-size:13px}
.wkc .m{font-size:11.5px;color:var(--muted)}
.wkc.near .h{color:var(--warn)}
.wkc.over .h{color:var(--danger)}
.wkc .ot{font-size:10.5px;font-weight:650;color:var(--danger)}
.wkc .nr{font-size:10.5px;color:var(--muted)}
.c .plus{opacity:0;align-self:flex-start;font-size:11.5px;color:var(--muted);border:1px dashed var(--border-strong);border-radius:6px;padding:1px 7px;margin-top:auto;pointer-events:none;transition:opacity .12s}
.c:hover .plus,.c:focus .plus{opacity:1}
.c.unavail{background:repeating-linear-gradient(45deg,transparent 0 7px,var(--hatch) 7px 8px),var(--surface)}
.unav{font-size:10.5px;color:var(--muted);line-height:1.2}
.toff{font-size:11.5px;border-radius:7px;padding:4px 7px;background:var(--timeoff);color:var(--text-2);border:1px solid var(--border);line-height:1.25}
.toff b{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase}
.toff.pending{background:repeating-linear-gradient(45deg,var(--timeoff) 0 6px,var(--surface) 6px 12px);border-style:dashed}

/* drop feedback */
.c.drop-ok{box-shadow:inset 0 0 0 2px var(--ok);background:color-mix(in srgb,var(--ok) 7%,var(--surface))}
.c.drop-warn{box-shadow:inset 0 0 0 2px var(--warn-strong)}
.c.drop-block{box-shadow:inset 0 0 0 2px var(--danger)}
.c[data-msg]::after{content:attr(data-msg);position:absolute;left:4px;right:4px;bottom:4px;font-size:10.5px;font-weight:600;padding:2px 5px;border-radius:5px;background:var(--surface);border:1px solid var(--border);pointer-events:none;line-height:1.25}
.c.drop-ok[data-msg]::after{color:var(--ok)}
.c.drop-warn[data-msg]::after{color:var(--warn)}
.c.drop-block[data-msg]::after{color:var(--danger)}

/* chips */
.chip{--rc:var(--r-default);display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;padding:4px 7px 5px;border-radius:7px;border:1px solid color-mix(in srgb,var(--rc) 75%,#000 14%);background:var(--rc);color:var(--role-fg);cursor:grab;position:relative;font-size:12px;line-height:1.25;gap:0}
.chip .t{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .s{font-size:11px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip.draft{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--rc) 58%,var(--surface)) 0 5px,color-mix(in srgb,var(--rc) 20%,var(--surface)) 5px 10px);border-style:dashed;color:var(--text)}
.chip.openc{background:var(--surface);border:1px dashed color-mix(in srgb,var(--danger) 55%,var(--border));color:var(--text)}
.chip.openc.draft{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--rc) 45%,var(--surface)) 0 5px,var(--surface) 5px 10px);border-color:color-mix(in srgb,var(--rc) 70%,#000 20%)}
.chip.openc .t{display:flex;gap:5px;align-items:center}
.chip.cancel{opacity:.6;border:1px dashed var(--danger);background:var(--surface-2);color:var(--text)}
.chip.cancel .t{text-decoration:line-through}
.chip .flag{position:absolute;top:-6px;right:-5px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;border:2px solid var(--surface);line-height:1}
.flag.block{background:var(--danger)}
.flag.warn{background:var(--warn-strong)}
.chip .dot{position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-radius:50%;background:var(--warn-strong);box-shadow:0 0 0 1.5px var(--surface)}
.chip:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.chip.dragging{opacity:.45}
.r-server{--rc:var(--r-server)} .r-bartender{--rc:var(--r-bartender)} .r-kitchen{--rc:var(--r-kitchen)} .r-host{--rc:var(--r-host)} .r-support{--rc:var(--r-support)} .r-default{--rc:var(--r-default)}
.rchip .s{display:flex;gap:4px;align-items:center}
.ini{display:inline-flex}
.ini i{font-style:normal;font-size:9.5px;font-weight:650;width:17px;height:17px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface);color:var(--text-2);margin-left:-4px;border:1px solid color-mix(in srgb,var(--rc) 70%,#000 15%)}
.ini i:first-child{margin-left:0}
.openb{font-size:10.5px;font-weight:650;color:var(--danger);margin-top:1px}

/* events lane */
.evp{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border-radius:7px;padding:5px 7px;border:1px solid var(--border-strong);background:var(--surface);gap:3px;font-size:12px;line-height:1.2;color:var(--text)}
.evp:hover{border-color:var(--text-2)}
.evp .en{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.evp .et{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.evp .fr{display:flex;align-items:center;gap:6px;width:100%}
.fill{display:flex;gap:2px;flex-wrap:wrap}
.fill i{width:6px;height:6px;border-radius:50%;background:var(--st)}
.fill i.e{background:none;box-shadow:inset 0 0 0 1px var(--st)}
.st{font-size:10.5px;font-weight:650;padding:0 6px;border-radius:999px;line-height:16px;color:var(--st);background:color-mix(in srgb,var(--st) 14%,transparent);margin-left:auto}
.ok{--st:var(--ok)} .mid{--st:var(--warn-strong)} .bad{--st:var(--danger)}

/* overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(452px,100%);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dr-h{padding:14px 16px 12px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.dr-h h2{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em;display:flex;gap:8px;align-items:center}
.dr-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.dr-b{flex:1;overflow:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:18px}
.dr-f{padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.pill{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;line-height:18px;display:inline-block}
.pill.draft{background:var(--warn-soft);color:var(--warn)}
.pill.pub{background:var(--ok-soft);color:var(--ok)}

/* Typed time ranges: 9-5, 9a-5:30p, 17-23, 6-2, 4p-12a, 10p-6a */
function parseTok(t){
  const m=t.trim().toLowerCase().match(/^(\d{1,2})(?::?(\d{2}))?\s*(a|am|p|pm)?$/);
  if(!m)return null;
  let h=+m[1];const mi=m[2]?+m[2]:0;const mer=m[3]?m[3][0]:null;
  if(mi>59||h>24)return null;
  if(mer){if(h<1||h>12)return null;h=mer==='a'?h%12:h%12+12;}
  return {h,mi,mer};
}
function parseRange(str){
  if(!str)return null;
  const parts=str.replace(/\s+to\s+/i,'-').split(/\s*[-–—]\s*/);
  if(parts.length!==2||!parts[0]||!parts[1])return null;
  const a=parseTok(parts[0]),b=parseTok(parts[1]);

  let s=(a.h*60+a.mi)%1440;
  if(!a.mer&&a.h>=1&&a.h<7)s+=720; // "5-11" reads as 5pm
  let e;
  if(b.mer||b.h>12||b.h===0||b.h===24){e=(b.h*60+b.mi)%1440;}
  else{const c1=(b.h*60+b.mi)%1440,c2=(c1+720)%1440;e=durMin(s,c1)<=durMin(s,c2)?c1:c2;}
  const d=durMin(s,e);
  if(d>=1440||d<30||d>16*60)return null;
  return {s,e};
}

const undoStack=[],redoStack=[];

/* ---------- domain: hours, cost, conflicts ---------- */
function absInt(x){const a=x.day*1440+x.s;return [a,a+durMin(x.s,x.e)];}
function overlaps(a,b){return a[0]<b[1]&&b[0]<a[1];}
function minutesFor(pid,exceptId){let m=0;for(const x of W().shifts){if(x.cancel||x.id===exceptId||!x.who.includes(pid))continue;m+=paid(x);}return m;}
function costOf(p,min){if(!p||p.rate==null)return null;const h=min/60;return Math.min(h,40)*p.rate+Math.max(h-40,0)*p.rate*1.5;}
function toLabel(t){return t.allDay?DAY[t.day]+', all day':DAY[t.day]+' '+fmtT(t.s)+'–'+fmtT(t.e);}
function timeOffFor(pid){
  const w=W();const out=w.timeOff.filter(t=>t.pid===pid).map(t=>Object.assign({},t));
  for(const r of w.requests){if(r.type==='timeoff'&&r.pid===pid&&r.status==='pending')out.push({pid,day:r.day,s:r.s,e:r.e,allDay:false,status:'pending'});}
  return out;
}
function conflictsFor(pid,x,opt){
  opt=opt||{};const p=personById(pid);const out=[];if(!p)return out;
  if(!p.roles.includes(x.role))out.push({sev:'warn',type:'role',text:'Not set up as '+x.role});
  const A=absInt(x);
  for(const o of W().shifts){
    if(o.id===x.id||o.id===opt.exceptId||o.cancel||!o.who.includes(pid))continue;
    if(overlaps(A,absInt(o)))out.push({sev:'block',type:'overlap',text:'Already on '+DAY[o.day]+' '+rng(o)+' '+o.role});
  }
  for(const t of timeOffFor(pid)){
    const a=t.day*1440+t.s,b=t.allDay?t.day*1440+1440:a+durMin(t.s,t.e);
    if(overlaps(A,[a,b]))out.push(t.status==='approved'?{sev:'block',type:'timeoff',text:'On approved time off '+toLabel(t)}:{sev:'warn',type:'timeoff',text:'Asked for time off '+toLabel(t)});
  }
  for(const u of p.unavail){if(overlaps(A,[u.day*1440+u.s,u.day*1440+u.e]))out.push({sev:'warn',type:'unavail',text:'Unavailable '+u.label});}
  if(!opt.skipOT){
    const cur=minutesFor(pid,x.id);const proj=cur+paid(x);
    if(proj>OT)out.push({sev:'warn',type:'ot',text:hrs(proj)+' this week, '+hrs(proj-OT)+' overtime'});
  }
  return out;
}
const worst=f=>f.some(c=>c.sev==='block')?'block':(f.length?'warn':null);

/* ---------- mutations ---------- */
function touch(x){if(x.status==='published'&&!x.changed){x.orig=editable(x);x.changed=true;}}
function liveWho(x,fn){x.who=fn(x.who);if(x.orig)x.orig.who=fn(x.orig.who);}
function removePerson(x,pid){touch(x);x.who=x.who.filter(p=>p!==pid);if(x.status==='published'&&!x.removedWho.includes(pid))x.removedWho.push(pid);delete x.overrides[pid];}
function newDraft(t,day,who,cap){const x={id:nid('s'),day,s:t.s,e:t.e,role:t.role,brk:t.brk,cap:cap||Math.max(who.length,1),who:who.slice(),status:'draft',changed:false,cancel:false,removedWho:[],event:t.event&&day===t.day?t.event:null,note:t.note||'',mnote:t.mnote||'',overrides:{}};W().shifts.push(x);return x;}
function addUnit(t,day,pid){
  const match=W().shifts.find(y=>y!==t&&!y.cancel&&y.day===day&&y.s===t.s&&y.e===t.e&&y.role===t.role&&!y.event&&(pid?y.cap-y.who.length>0&&!y.who.includes(pid):y.status==='draft'));
  if(match){touch(match);if(pid)match.who.push(pid);else match.cap+=1;return match;}
  return newDraft(t,day,pid?[pid]:[],1);
}
function deleteShift(x){if(x.status==='draft'){W().shifts=W().shifts.filter(y=>y!==x);}else{touch(x);x.cancel=true;}}

function dropOn(drag,tgt,copy){
  const x=shiftById(drag.shiftId);if(!x)return;
  const from=drag.pid||null,to=tgt.pid||null,day=tgt.day;
  const Pf=from?personById(from):null,Pt=to?personById(to):null;
  if(!copy&&day===x.day&&from===to)return;
  if(to&&x.who.includes(to)&&day===x.day){toast(first(Pt)+' is already on this shift.');return;}
  if(!from&&x.cap-x.who.length<=0){toast('No open slot left on this shift.');return;}
  snapshot();let msg='';
  if(!copy&&day===x.day){
    if(from&&to){touch(x);x.who=x.who.map(p=>p===from?to:p);if(x.status==='published')x.removedWho.push(from);msg=DAY[x.day]+' '+rng(x)+' '+x.role+' moved from '+first(Pf)+' to '+first(Pt)+'.';}
    else if(from){removePerson(x,from);msg=first(Pf)+' is off '+DAY[x.day]+' '+rng(x)+'. The slot is open.';}
    else{touch(x);x.who.push(to);msg=first(Pt)+' fills the open '+x.role+' slot.';}
  }else if(!copy){
    if(x.cap===1){
      touch(x);x.day=day;if(x.event)x.event=null;
      if(from&&from!==to&&x.status==='published')x.removedWho.push(from);
      x.who=to?[to]:[];
      msg=to?(from&&from!==to?'Moved to '+first(Pt)+', ':'Moved to ')+dshort(day)+'.':'Moved to '+dshort(day)+' as an open shift.';
    }else{
      touch(x);if(from){x.who=x.who.filter(p=>p!==from);if(x.status==='published')x.removedWho.push(from);}
      x.cap-=1;addUnit(x,day,to);
      msg=(to?first(Pt)+' now has ':'Open ')+x.role+' '+rng(x)+' on '+dshort(day)+'.';
    }
  }else{
    addUnit(x,day,to);
    msg='Copied '+x.role+' '+rng(x)+' to '+(to?first(Pt)+', ':'Open shifts, ')+dshort(day)+' as a draft.';
  }
  render();toast(msg,'undo');
}

function personCell(p,d,r){
  const w=W();
  const toffs=timeOffFor(p.id).filter(t=>t.day===d);
  const un=p.unavail.filter(u=>u.day===d);
  const list=w.shifts.filter(x=>x.day===d&&x.who.includes(p.id)).sort((a,b)=>a.s-b.s);
  const removed=w.shifts.filter(x=>x.day===d&&x.cancel&&x.orig&&x.orig.who.includes(p.id)&&!x.who.includes(p.id));
  let h=`<div class="c${un.length?' unavail':''}" tabindex="-1" data-kind="person" data-pid="${p.id}" data-day="${d}" data-r="${r}" data-c="${d}" aria-label="${esc(p.name)}, ${dlong(d)}">`;
  h+=un.map(u=>`<span class="unav">Unavailable ${esc(u.label.replace(/^\w+ /,''))}</span>`).join('');
  h+=toffs.map(t=>`<div class="toff${t.status==='pending'?' pending':''}"><b>${t.status==='pending'?'Time off requested':'Time off'}</b>${t.allDay?'All day':fmtT(t.s)+'–'+fmtT(t.e)}</div>`).join('');
  h+=list.map(x=>personChip(x,p.id)).join('');
  h+=removed.map(x=>personChip(Object.assign({},x,{who:[p.id]}),p.id)).join('');
  h+='<span class="plus" aria-hidden="true">+ Add</span></div>';
  return h;
}
function visiblePeople(){
  const l=L();const q=S.q.trim().toLowerCase();
  return l.people.filter(p=>{
    if(q&&!p.name.toLowerCase().includes(q))return false;
    if(S.roleF!=='all'&&!p.roles.includes(S.roleF))return false;
    if(S.schedOnly&&!minutesFor(p.id))return false;
    return true;
  });
}
function renderGrid(){
  const g=$('#grid');const w=W();const l=L();const out=[];let r=0;
  const days=[0,1,2,3,4,5,6];
  out.push(`<div class="gh corner"><b>${S.group==='people'?'Team':'Roles'}</b><span class="muted" style="font-size:11.5px">${S.group==='people'?visiblePeople().length+' people':l.roles.length+' roles'}</span></div>`);
  days.forEach(d=>out.push(dayHead(d)));
  const ws=weekStats();out.push(`<div class="gh wkh"><span class="dn">Week</span><span class="gh-r2" title="Includes overtime premium">${hrs(ws.min)} · ${money(ws.cost)}</span></div>`);
  // events lane
  const evs=w.events;
  out.push(`<div class="lab sys"><div class="nmw"><span class="nm">Events</span><span class="meta">${evs.length?evs.length+' this week':'Click a day to add one'}</span></div></div>`);
  days.forEach(d=>out.push(`<div class="c sys" tabindex="-1" data-kind="event" data-day="${d}" data-r="${r}" data-c="${d}" aria-label="Events, ${dlong(d)}">${evs.filter(e=>e.day===d).map(eventPill).join('')}<span class="plus" aria-hidden="true">+ Event</span></div>`));
  out.push('<div class="c wkc sys"></div>');r++;
  if(S.group==='people'){
    // open shifts row
    const openAll=w.shifts.filter(x=>(x.cap-x.who.length>0)||(x.cancel&&!x.who.length));
    const openN=w.shifts.filter(x=>!x.cancel).reduce((n,x)=>n+Math.max(x.cap-x.who.length,0),0);
    out.push(`<div class="lab sys"><div class="nmw"><span class="nm">Open shifts</span><span class="meta">${openN?openN+' slots to fill':'All filled'}</span></div></div>`);
    days.forEach(d=>out.push(`<div class="c sys" tabindex="-1" data-kind="open" data-day="${d}" data-r="${r}" data-c="${d}" aria-label="Open shifts, ${dlong(d)}">${openAll.filter(x=>x.day===d).sort((a,b)=>a.s-b.s).map(openChip).join('')}<span class="plus" aria-hidden="true">+ Open shift</span></div>`));
    out.push(`<div class="c wkc sys"><span class="h" style="color:${openN?'var(--danger)':'inherit'}">${openN}</span><span class="m">open</span></div>`);r++;
    // people grouped by primary role; agency last
    const vis=visiblePeople();
    const groups=l.roles.map(role=>({role,people:vis.filter(p=>p.kind!=='agency'&&p.roles[0]===role)}));
    groups.push({role:'Agency',people:vis.filter(p=>p.kind==='agency')});
    for(const gr of groups){
      if(!gr.people.length)continue;
      out.push(`<div class="grp"><span><i class="rdot r-${gr.role==='Agency'?'default':tone(gr.role)}"></i>${esc(gr.role==='Agency'?'Agency':gr.role+'s')} · ${gr.people.length}</span></div>`);
      for(const p of gr.people){
        const m=minutesFor(p.id);const c=costOf(p,m);
        const meta=p.kind==='invited'?`<span class="tag inv">Invited</span> no app yet`:p.kind==='agency'?`<span class="tag ag">Agency</span> ${esc(p.agency)}`:esc(p.roles.join(', '))+(p.rate!=null?' · $'+p.rate+'/h':'');
        out.push(`<div class="lab"><span class="av${p.kind==='invited'?' inv':p.kind==='agency'?' ag':''}" aria-hidden="true">${initials(p.name)}</span><div class="nmw"><span class="nm">${esc(p.name)}</span><span class="meta">${meta}</span></div></div>`);
        days.forEach(d=>out.push(personCell(p,d,r)));
        const cls=m>OT?'over':m>=OT-240?'near':'';
        out.push(`<div class="c wkc ${cls}"><span class="h">${hrs(m)}</span>${c!=null?`<span class="m">${money(c)}</span>`:(m?'<span class="nr">No pay rate</span>':'')}${m>OT?`<span class="ot">+${hrs(m-OT)} OT</span>`:''}</div>`);
        r++;
      }
    }
    if(!vis.length)out.push(`<div class="grp"><span>No people match these filters.</span></div>`);
  }else{
    for(const role of l.roles){
      const rs=w.shifts.filter(x=>x.role===role);
      const need=rs.filter(x=>!x.cancel).reduce((n,x)=>n+x.cap,0),open=rs.filter(x=>!x.cancel).reduce((n,x)=>n+Math.max(x.cap-x.who.length,0),0);
      const min=rs.filter(x=>!x.cancel).reduce((n,x)=>n+paid(x)*x.cap,0);
      out.push(`<div class="lab"><i class="rdot r-${tone(role)}" aria-hidden="true"></i><div class="nmw"><span class="nm">${esc(role)}</span><span class="meta">${need} spots · ${L().people.filter(p=>p.roles.includes(role)).length} people</span></div></div>`);
      days.forEach(d=>out.push(`<div class="c" tabindex="-1" data-kind="role" data-role="${esc(role)}" data-day="${d}" data-r="${r}" data-c="${d}" aria-label="${esc(role)}, ${dlong(d)}">${rs.filter(x=>x.day===d).sort((a,b)=>a.s-b.s).map(roleChip).join('')}<span class="plus" aria-hidden="true">+ ${esc(role)}</span></div>`));
      out.push(`<div class="c wkc"><span class="h">${hrs(min)}</span><span class="m">planned</span>${open?`<span class="ot">${open} open</span>`:''}</div>`);
      r++;
    }
  }
  g.innerHTML=out.join('');
  // roving tabindex
  let fc=g.querySelector(`.c[data-r="${S.focus.r}"][data-c="${S.focus.c}"]`)||g.querySelector('.c[data-r="1"][data-c="0"]');
  if(fc)fc.tabIndex=0;
}

function statusPill(x){return x.cancel?'<span class="pill rm">Removed on publish</span>':x.status==='draft'?'<span class="pill draft">Draft</span>':x.changed?'<span class="pill chg">Edited · not published</span>':'<span class="pill pub">Published</span>';}
function shiftDrawer(){
  const x=shiftById(S.drawer.id);if(!x){S.drawer=null;return '';}
  const l=L();const open=Math.max(x.cap-x.who.length,0);
  const assigned=x.who.map(pid=>{
    const p=personById(pid);const f=conflictsFor(pid,x);const m=minutesFor(pid);

      ${f.length?`<div class="why">${f.map(c=>`<span class="${c.sev}">${esc(c.text)}</span>`).join('')}${x.overrides[pid]?'<span>Scheduled anyway</span>':''}</div>`:''}</div>

    const score=(f.some(c=>c.sev==='block')?30:0)+(qual?0:20)+(f.length?10:0)+m/600;
    return {p,f,qual,m,score};
  }).sort((a,b)=>a.score-b.score);
  const shown=S.allCand?cands:cands.slice(0,6);

  }).join('');

  return `<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drT">
    <div class="dr-h"><span class="rdot r-${tone(x.role)}" style="margin-top:6px" aria-hidden="true"></span><div><h2 id="drT">${esc(x.role)} · ${DAY[x.day]} ${rng(x)}</h2><p>${esc(l.name)} · ${dlong(x.day)} · ${statusPill(x)}</p></div><button type="button" class="xbtn" data-close aria-label="Close">✕</button></div>
    <div class="dr-b">
      ${x.status==='draft'?'<p class="note">Draft. Staff can’t see this shift until you publish the week.</p>':x.changed&&!x.cancel?'<p class="note">You edited a published shift. Staff keep seeing the old version until you publish.</p>':''}
      <div class="fgrid">

      <button type="button" class="btn sm" data-act="dup">Duplicate</button>

      <button type="button" class="btn sm ghost" data-act="page">Open shift page</button>
      <span class="spacer"></span>
      ${x.cancel?'<button type="button" class="btn sm" data-act="restore">Keep this shift</button>':`<button type="button" class="btn sm danger" data-act="delete">${x.status==='draft'?'Delete draft':'Remove shift'}</button>`}
    </div></aside>`;
}

function reqImpact(r){
  const w=W();
  if(r.type==='timeoff'){
    const p=personById(r.pid);const A=[r.day*1440+r.s,r.day*1440+r.s+durMin(r.s,r.e)];
    const hit=w.shifts.filter(x=>!x.cancel&&x.who.includes(r.pid)&&overlaps(A,absInt(x)));
    return hit.length?`Overlaps ${esc(first(p))}’s ${hit.map(x=>DAY[x.day]+' '+rng(x)+' '+x.role).join(', ')} shift. Approving turns ${hit.length===1?'it':'them'} into open slots.`:'No scheduled shifts are affected.';
  }
  const x=shiftById(r.shiftId);if(!x)return 'This shift no longer exists.';
  if(r.type==='swap'){
    const to=personById(r.to),fr=personById(r.from);const f=conflictsFor(r.to,x);const m=minutesFor(r.to);
    return `${esc(first(to))} accepted. ${esc(first(to))} goes from ${hrs(m)} to ${hrs(m+paid(x))}; ${esc(first(fr))} drops to ${hrs(minutesFor(r.from)-paid(x))}.${f.length?' ⚠ '+f.map(c=>esc(c.text)).join('; '):' No conflicts.'}`;
  }
  if(r.type==='claim'){
    const p=personById(r.pid);const f=conflictsFor(r.pid,x);const m=minutesFor(r.pid);
    return `${esc(first(p))} goes from ${hrs(m)} to ${hrs(m+paid(x))}.${f.length?' ⚠ '+f.map(c=>esc(c.text)).join('; '):' No conflicts.'}`;
  }
  if(r.type==='drop'){
    const free=L().people.filter(p=>p.id!==r.pid&&p.roles.includes(x.role)&&!conflictsFor(p.id,x).some(c=>c.sev==='block'));
    return `Creates 1 open ${esc(x.role)} slot ${DAY[x.day]} ${rng(x)}${S.week===0&&x.day===0?' <b>(starts today)</b>':''}. ${free.length?'Free to cover: '+free.map(p=>esc(first(p))).join(', ')+'.':'Nobody else in this role is free.'}`;
  }
  return '';
}
function reqTitle(r){
  if(r.type==='timeoff')return {who:personById(r.pid),kind:'Time off',when:dlong(r.day)+' · '+fmtLong(r.s)+' – '+fmtLong(r.e)};
  const x=shiftById(r.shiftId);const when=x?dlong(x.day)+' · '+fmtLong(x.s)+' – '+fmtLong(x.e)+' · '+x.role:'Shift removed';
  if(r.type==='swap')return {who:personById(r.from),kind:'Swap',when,extra:'Hand off to '+personById(r.to).name};
  if(r.type==='claim')return {who:personById(r.pid),kind:'Open-shift claim',when};
  return {who:personById(r.pid),kind:'Drop',when};
}
function requestsDrawer(){
  const w=W();const tabs=[['all','All'],['timeoff','Time off'],['swap','Swaps & drops'],['claim','Claims']];

  const pend=w.requests.filter(r=>r.status==='pending'&&match(r));
  const done=w.requests.filter(r=>r.status!=='pending'&&match(r));
  const count=t=>w.requests.filter(r=>r.status==='pending'&&(t==='all'||r.type===t||(t==='swap'&&r.type==='drop'))).length;
  return `<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="rqT">
    <div class="dr-h"><div><h2 id="rqT">Requests</h2><p>${esc(L().name)} · ${weekLabel(S.week)} · from the mobile app</p></div><button type="button" class="xbtn" data-close aria-label="Close">✕</button></div>
    <div class="tabs2" role="tablist">${tabs.map(([k,n])=>`<button type="button" role="tab" aria-selected="${S.reqTab===k}" data-reqtab="${k}">${n}${count(k)?` <span class="badge">${count(k)}</span>`:''}</button>`).join('')}</div>
    <div class="dr-b">
      ${pend.length?pend.map(r=>{const t=reqTitle(r);const x=r.shiftId?shiftById(r.shiftId):true;
        return `<article class="req"><div class="req-h"><span class="av" aria-hidden="true">${initials(t.who.name)}</span><div><div class="pn">${esc(t.who.name)}</div><div class="ps">${esc(r.when)}</div></div><span class="kind">${t.kind}</span></div>
          <div class="when">${t.when}</div>${t.extra?`<p class="quote">${esc(t.extra)}</p>`:''}${r.reason?`<p class="quote">“${esc(r.reason)}”</p>`:''}
          <p class="note">${reqImpact(r)}</p>
          <div class="acts"><button type="button" class="btn sm" data-req="${r.id}" data-dec="decline">Decline</button><button type="button" class="btn sm primary" data-req="${r.id}" data-dec="approve"${x?'':' disabled'}>Approve</button></div></article>`;}).join(''):`<p class="note">No pending requests here.</p>`}
      ${done.length?`<section class="sec"><h3>Handled</h3>${done.map(r=>{const t=reqTitle(r);return `<div class="done"><b>${esc(t.who.name)}</b> · ${t.kind} · ${r.status==='approved'?'Approved':'Declined'} just now</div>`;}).join('')}</section>`:''}
      <p class="help">Claim policy: you approve each claim. Swaps need the coworker to accept first, then you. Change this in Settings.</p>
    </div></aside>`;
}

function publishDiff(){
  const w=W();
  const drafts=w.shifts.filter(x=>x.status==='draft'),changed=w.shifts.filter(x=>x.status==='published'&&x.changed&&!x.cancel),removed=w.shifts.filter(x=>x.cancel);
  const blocking=[];
  for(const x of drafts.concat(changed))for(const pid of x.who){const b=conflictsFor(pid,x,{skipOT:true}).filter(c=>c.sev==='block');if(b.length&&!x.overrides[pid])blocking.push({x,pid,text:b[0].text});}
  return {drafts,changed,removed,blocking};
}
function audience(d,hold){
  const held=new Set(hold?d.blocking.filter(b=>b.x.status==='draft').map(b=>b.x.id):[]);
  const ids=new Set();let open=[];
  d.drafts.filter(x=>!held.has(x.id)).forEach(x=>{x.who.forEach(p=>ids.add(p));if(x.cap>x.who.length)open.push(x);});
  d.changed.forEach(x=>{x.who.forEach(p=>ids.add(p));x.removedWho.forEach(p=>ids.add(p));if(x.cap>x.who.length)open.push(x);});
  d.removed.forEach(x=>{x.who.forEach(p=>ids.add(p));(x.orig?x.orig.who:[]).forEach(p=>ids.add(p));});
  const ppl=[...ids].map(personById).filter(Boolean);
  return {held,reach:ppl.filter(p=>p.kind==='roster'),unreach:ppl.filter(p=>p.kind!=='roster'),open};
}

      <div class="dr-b">
        <div class="kpis"><div class="kpi"><b>${nNew}</b><span>new shift${nNew===1?'':'s'}</span></div><div class="kpi"><b>${d.changed.length}</b><span>edited</span></div><div class="kpi"><b>${d.removed.length}</b><span>removed</span></div></div>
        <div class="box"><h3>Notified in the app · ${a.reach.length}</h3><p>${a.reach.length?a.reach.map(p=>esc(p.name)).join(', '):'Nobody on the app is affected.'}</p></div>

        ${a.open.length?`<div class="box"><h3>Open slots offered · ${a.open.reduce((n,x)=>n+x.cap-x.who.length,0)}</h3><p>${openTxt}</p><p class="help">Qualified staff can claim these in the app. You approve each claim.</p></div>`:''}
        ${d.blocking.length?`<div class="box dangerb"><h3>Blocking conflicts · ${d.blocking.length}</h3><ul>${d.blocking.map(b=>`<li>${esc(personById(b.pid).name)}, ${DAY[b.x.day]} ${rng(b.x)} ${esc(b.x.role)}: ${esc(b.text)} <button type="button" class="linkbtn" data-review="${b.x.id}">Review</button></li>`).join('')}</ul>
          <label class="chk"><input type="checkbox" id="holdBack"${M.hold?' checked':''}> Keep these as drafts and publish everything else</label></div>`:''}
      </div>
      <div class="dr-f"><span class="spacer"></span><button type="button" class="btn ghost" data-close>Keep editing</button><button type="button" class="btn primary" id="doPublish"${(nNew+d.changed.length+d.removed.length)?'':' disabled'}>${a.reach.length?'Publish and notify '+a.reach.length:'Publish'}</button></div></div>`;
  }
  if(M.type==='discard'){
    const n=pendingCount();
    return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="dcT"><div class="dr-h"><div><h2 id="dcT">Discard ${n} unpublished change${n===1?'':'s'}?</h2><p>${esc(l.name)} · ${weekLabel(S.week)}</p></div><button type="button" class="xbtn" data-close aria-label="Close">✕</button></div>
      <div class="dr-b"><p style="margin:0">Drafts are deleted. Edited and removed shifts go back to what staff see now. Other weeks and locations are not touched.</p></div>
      <div class="dr-f"><span class="spacer"></span><button type="button" class="btn ghost" data-close>Keep editing</button><button type="button" class="btn danger solid" id="doDiscard">Discard changes</button></div></div>`;

      <div class="dr-b">
        <label class="radio"><input type="radio" name="cpm" value="people"${M.mode!=='open'?' checked':''}><span>Keep the same people<small>Anyone on time off or double-booked becomes an open slot instead.</small></span></label>

      </div>

    return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="kyT"><div class="dr-h"><div><h2 id="kyT">Keyboard shortcuts</h2></div><button type="button" class="xbtn" data-close aria-label="Close">✕</button></div>

  }
  return '';
}

/* ---------- actions ---------- */
function doPublish(){
  const d=publishDiff();const a=audience(d,S.modal.hold);
  snapshot();
  let n=0;
  for(const x of d.drafts){if(a.held.has(x.id))continue;x.status='published';x.changed=false;delete x.orig;x.removedWho=[];n++;}
  for(const x of d.changed){x.changed=false;delete x.orig;x.removedWho=[];n++;}
  n+=d.removed.length;W().shifts=W().shifts.filter(x=>!x.cancel);
  S.modal=null;render();
  toast(`Published ${n} change${n===1?'':'s'}. ${a.reach.length} ${a.reach.length===1?'person':'people'} notified${a.held.size?'; '+a.held.size+' kept as draft':''}.`,'undo');
}
function doDiscard(){
  snapshot();const w=W();
  w.shifts=w.shifts.filter(x=>x.status!=='draft');
  for(const x of w.shifts){if(x.orig){Object.assign(x,x.orig);delete x.orig;}x.changed=false;x.cancel=false;x.removedWho=[];}
  S.modal=null;render();toast('Unpublished changes discarded.','undo');
}
function doCopy(){
  const mode=($('input[name="cpm"]:checked')||{}).value||'people';const skip=$('#cpSkip').checked;
  const src=L().weeks[S.week-1];
  if(!src||!src.shifts.length){S.modal=null;renderLayer();toast(weekLabel(S.week-1)+' has no shifts to copy.');return;}
  snapshot();const w=W();let copied=0,opened=0,skipped=0;const busy=new Set(w.shifts.map(x=>x.day));
  for(const x of src.shifts){
    if(x.cancel||x.event){if(x.event)skipped++;continue;}
    if(skip&&busy.has(x.day))continue;
    const y=newDraft(x,x.day,[],x.cap);y.event=null;
    if(mode==='people'){for(const pid of x.who){if(conflictsFor(pid,y,{skipOT:true}).some(c=>c.sev==='block'))opened++;else y.who.push(pid);}}
    copied++;
  }
  w.dismissed=true;S.modal=null;render();
  toast(`Copied ${copied} shift${copied===1?'':'s'} as drafts.${opened?' '+opened+' spot'+(opened===1?' is':'s are')+' open because of time off or overlaps.':''}${skipped?' Skipped '+skipped+' event shift'+(skipped===1?'':'s')+'.':''}`,'undo');
}
function doTemplate(){
  const id=($('input[name="tpl"]:checked')||{}).value;const t=L().templates.find(v=>v.id===id);if(!t)return;
  snapshot();let n=0;
  for(const sp of t.specs){const p=sp.r.split('-');const s=t24(p[0]),e=t24(p[1]);for(const d of sp.days){newDraft({s,e,role:sp.role,brk:autoBrk(s,e),event:null,day:d},d,[],sp.cap);n++;}}
  W().dismissed=true;S.modal=null;render();toast(`Added ${n} open draft shifts from “${t.name}”.`,'undo');
}
function decide(id,dec){
  const w=W();const r=w.requests.find(v=>v.id===id);if(!r)return;
  snapshot();let msg='';
  if(dec==='decline'){r.status='declined';const t=reqTitle(r);msg=`Declined. ${first(t.who)} was notified.`;}
  else{
    r.status='approved';
    if(r.type==='timeoff'){
      w.timeOff.push({pid:r.pid,day:r.day,s:r.s,e:r.e,allDay:false,status:'approved'});
      const A=[r.day*1440+r.s,r.day*1440+r.s+durMin(r.s,r.e)];
      const hit=w.shifts.filter(x=>!x.cancel&&x.who.includes(r.pid)&&overlaps(A,absInt(x)));
      hit.forEach(x=>liveWho(x,ws=>ws.filter(p=>p!==r.pid)));
      msg=`Approved ${first(personById(r.pid))}’s time off.${hit.length?' '+hit.map(x=>DAY[x.day]+' '+rng(x)+' '+x.role).join(', ')+' is now open.':''}`;
    }else{
      const x=shiftById(r.shiftId);
      if(r.type==='swap'){liveWho(x,ws=>ws.map(p=>p===r.from?r.to:p));msg=`Approved. ${first(personById(r.to))} now has ${DAY[x.day]} ${rng(x)}. Both were notified.`;}
      if(r.type==='claim'){liveWho(x,ws=>ws.concat([r.pid]));msg=`Approved. ${first(personById(r.pid))} is on ${DAY[x.day]} ${rng(x)} and was notified.`;}
      if(r.type==='drop'){liveWho(x,ws=>ws.filter(p=>p!==r.pid));msg=`Approved. ${DAY[x.day]} ${rng(x)} ${x.role} is now open and offered to qualified staff.`;}
    }
  }
  render();toast(msg,'undo');
}
function drawerAct(act,el){
  const D=S.drawer;
  if(D.type==='shift'){
    const x=shiftById(D.id);if(!x)return;
    if(act==='assign'){const pid=el.dataset.pid;if(x.who.length>=x.cap)return;snapshot();touch(x);x.who.push(pid);if(el.dataset.force==='1')x.overrides[pid]=true;render();toast(`${first(personById(pid))} added to ${x.role} ${DAY[x.day]} ${rng(x)}${el.dataset.force==='1'?' (scheduled anyway)':''}.`,'undo');}
    if(act==='unassign'){const pid=el.dataset.pid;snapshot();removePerson(x,pid);render();toast(`${first(personById(pid))} is off this shift. The slot stays open.`,'undo');}
    if(act==='allcand'){S.allCand=!S.allCand;renderLayer();}
    if(act==='dup'){snapshot();const y=newDraft(x,x.day,[],x.cap);y.event=x.event;S.drawer={type:'shift',id:y.id};render();toast('Duplicated as an open draft.','undo');}
    if(act==='tpl'){L().templates.push({id:nid('t'),name:x.role+' '+rng(x),desc:DAY[x.day]+' · '+x.cap+' '+x.role+' '+rng(x),specs:[{days:[x.day],r:String(Math.floor(x.s/60)).padStart(2,'0')+':'+String(x.s%60).padStart(2,'0')+'-'+String(Math.floor(x.e/60)).padStart(2,'0')+':'+String(x.e%60).padStart(2,'0'),role:x.role,cap:x.cap}]});toast(`Saved “${x.role} ${rng(x)}” as a template.`);}
    if(act==='page'){toast('This opens the existing shift page, which stays as it is today.');}
    if(act==='delete'){snapshot();const was=x.status;deleteShift(x);if(was==='draft')S.drawer=null;render();toast(was==='draft'?'Draft deleted.':'This shift will be removed when you publish.','undo');}
    if(act==='restore'){snapshot();x.cancel=false;render();toast('Shift kept.','undo');}
  }else if(D.type==='event'){
    if(!D.id){
      const d=D.draft;
      if(act==='addline'){d.lines.push({role:L().roles[0],n:1});renderLayer();}
      if(act==='rmline'){d.lines.splice(+el.dataset.i,1);renderLayer();}
      if(act==='createEvent'){
        const r=parseRange(d.range);const name=d.name.trim();
        const help=$('#ev-help');
        if(!name){help.className='help err span2';help.textContent='Give the event a name.';$('#ev-name').focus();return;}
        if(!r){help.className='help err span2';help.textContent='Use a time range like 4p-11p.';$('#ev-time').focus();return;}
        snapshot();const ev={id:nid('ev'),name,day:d.day,s:r.s,e:r.e,notes:d.notes.trim()};W().events.push(ev);
        let n=0;for(const ln of d.lines){newDraft({s:r.s,e:r.e,role:ln.role,brk:autoBrk(r.s,r.e),event:ev.id,day:d.day},d.day,[],Math.max(1,Math.min(50,+ln.n||1)));n+=+ln.n||1;}
        S.drawer={type:'event',id:ev.id};render();toast(`Created “${name}” with ${n} open slots as drafts.`,'undo');
      }
    }else{
      const ev=eventById(D.id);
      if(act==='staff'){openShiftDrawer(el.dataset.id);}
      if(act==='evAddLine'){snapshot();const n=Math.max(1,Math.min(50,+$('#ev-add-n').value||1));newDraft({s:ev.s,e:ev.e,role:$('#ev-add-role').value,brk:autoBrk(ev.s,ev.e),event:ev.id,day:ev.day},ev.day,[],n);render();toast('Role added as a draft.','undo');}
      if(act==='evRoles'){S.group='roles';S.drawer=null;render();}
      if(act==='evDelete'){snapshot();W().shifts.filter(x=>x.event===ev.id).forEach(deleteShift);W().events=W().events.filter(e=>e!==ev);W().shifts.forEach(x=>{if(x.event===ev.id&&x.status==='draft')x.event=null;});S.drawer=null;render();toast(`Deleted “${ev.name}”. Published shifts are removed when you publish.`,'undo');}
    }
  }
}
function drawerChange(el){
  const D=S.drawer;if(!D)return;
  if(D.type==='shift'){
    const x=shiftById(D.id);if(!x)return;
    const id=el.id;
    if(id==='dr-time'){const r=parseRange(el.value);const h=$('#dr-time-help');if(!r){h.className='help err span2';h.textContent='Use a range like 9-5, 4p-11p or 6-2.';return;}if(r.s===x.s&&r.e===x.e)return;snapshot();touch(x);x.s=r.s;x.e=r.e;}
    else if(id==='dr-day'){snapshot();touch(x);x.day=+el.value;}
    else if(id==='dr-role'){snapshot();touch(x);x.role=el.value;}
    else if(id==='dr-brk'){snapshot();touch(x);x.brk=+el.value;}
    else if(id==='dr-cap'){const v=Math.max(1,Math.min(50,Math.floor(+el.value||1)));if(v<x.who.length){const h=$('#dr-cap-help');h.hidden=false;h.textContent=`${x.who.length} people are on this shift. Take someone off first.`;el.value=x.cap;return;}if(v===x.cap)return;snapshot();touch(x);x.cap=v;}
    else if(id==='dr-event'){snapshot();touch(x);x.event=el.value||null;}
    else if(id==='dr-note'){if(el.value===x.note)return;snapshot();touch(x);x.note=el.value;}
    else if(id==='dr-mnote'){if(el.value===x.mnote)return;snapshot();x.mnote=el.value;}
    else return;
    render();
  }
}

/* ---------- toast ---------- */
function toast(msg,action){
  clearTimeout(S.toastTimer);
  const btn=action==='undo'?'<button type="button" data-undo>Undo</button>':action==='redo'?'<button type="button" data-redo>Redo</button>':'';
  $('#toastlayer').innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${btn}</div>`;
  S.toastTimer=setTimeout(()=>{$('#toastlayer').innerHTML='';},6000);
}
function undo(){if(!undoStack.length){toast('Nothing to undo.');return;}redoStack.push(JSON.stringify(S.data));S.data=JSON.parse(undoStack.pop());closePop();if(S.drawer&&S.drawer.type==='shift'&&!shiftById(S.drawer.id))S.drawer=null;if(S.drawer&&S.drawer.type==='event'&&S.drawer.id&&!eventById(S.drawer.id))S.drawer=null;if(S.modal&&S.modal.type!=='keys')S.modal=null;render();toast('Undone.','redo');}
function redo(){if(!redoStack.length){toast('Nothing to redo.');return;}undoStack.push(JSON.stringify(S.data));S.data=JSON.parse(redoStack.pop());if(S.drawer&&S.drawer.type==='shift'&&!shiftById(S.drawer.id))S.drawer=null;render();toast('Redone.','undo');}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-undo]')){undo();return;}
  if(t.closest('[data-redo]')){redo();return;}
  const nav=t.closest('[data-nav]');if(nav){toast(`${nav.dataset.nav} is unchanged in this redesign.`);return;}
  if(S.menu&&!t.closest('#menu')&&!t.closest('#toolsBtn')){S.menu=false;renderLayer();}
  if(S.pop&&!t.closest('#pop')&&!t.closest('.c')){closePop();}
  if(t.closest('[data-close]')){if(S.pop&&t.closest('#pop')){closePop();return;}S.drawer=null;S.modal=null;renderLayer();return;}
  if(t.id==='prevW'||t.id==='nextW'){S.week+=t.id==='prevW'?-1:1;closeAll();render();return;}
  if(t.id==='todayW'){S.week=0;closeAll();render();return;}
  const gb=t.closest('[data-group]');if(gb){S.group=gb.dataset.group;S.focus={r:1,c:0};render();return;}
  if(t.closest('#toolsBtn')){S.menu=!S.menu;renderLayer();const m=$('#menu button');if(m&&S.menu)m.focus();return;}
  const tool=t.closest('[data-tool]');
  if(tool){S.menu=false;const k=tool.dataset.tool;
    if(k==='copy'){S.drawer=null;S.modal={type:'copy',mode:'people',skip:true};}
    if(k==='template'){S.drawer=null;S.modal={type:'template'};}
    if(k==='discard'){S.modal={type:'discard'};}
    if(k==='keys'){S.modal={type:'keys'};}
    if(k==='event'){openEventDrawer(null,null);return;}
    renderLayer();return;}
  if(t.id==='dismissEmpty'){W().dismissed=true;renderTop();return;}
  if(t.closest('#reqBtn')){closePop();S.drawer={type:'requests'};renderLayer();return;}
  if(t.closest('#pubBtn')){closePop();S.drawer=null;S.modal={type:'publish',hold:true};renderLayer();return;}
  if(t.id==='doPublish'){doPublish();return;}
  if(t.id==='doDiscard'){doDiscard();return;}
  if(t.id==='doCopy'){doCopy();return;}
  if(t.id==='doTpl'){doTemplate();return;}
  if(t.id==='qc-add'){commitCreate();return;}
  const rv=t.closest('[data-review]');if(rv){S.modal=null;openShiftDrawer(rv.dataset.review);return;}
  const rt=t.closest('[data-reqtab]');if(rt){S.reqTab=rt.dataset.reqtab;renderLayer();return;}
  const rq=t.closest('[data-req]');if(rq){decide(rq.dataset.req,rq.dataset.dec);return;}
  const act=t.closest('[data-act]');if(act&&S.drawer){drawerAct(act.dataset.act,act);return;}
  const ev=t.closest('[data-event]');if(ev&&t.closest('#grid')){openEventDrawer(ev.dataset.event);return;}
  const chip=t.closest('[data-chip]');if(chip&&t.closest('#grid')){openShiftDrawer(chip.dataset.chip);return;}
  const cell=t.closest('#grid .c[data-day]');
  if(cell){S.focus={r:+cell.dataset.r,c:+cell.dataset.c};$$('#grid .c[tabindex="0"]').forEach(c=>c.tabIndex=-1);cell.tabIndex=0;cell.focus({preventScroll:true});openCreate(cell);return;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='loc'){S.loc=t.value;S.week=0;S.q='';S.roleF='all';closeAll();$('#orgName').textContent=S.loc==='downtown'?'Downtown Bistro Group':'Riverside Market';render();return;}
  if(t.id==='roleF'){S.roleF=t.value;renderGrid();return;}
  if(t.id==='schedOnly'){S.schedOnly=t.checked;renderGrid();return;}
  if(t.id==='holdBack'){S.modal.hold=t.checked;renderLayer();return;}
  if(t.name==='cpm'&&S.modal){S.modal.mode=t.value;return;}
  if(t.id==='qc-brk'&&S.pop){S.pop.brkTouched=true;previewCreate();return;}
  if((t.id==='qc-role')&&S.pop){previewCreate();return;}
  if(S.drawer&&S.drawer.type==='event'&&!S.drawer.id){
    const d=S.drawer.draft;
    if(t.dataset.line!=null){const ln=d.lines[+t.dataset.line];if(t.dataset.k==='role')ln.role=t.value;else ln.n=Math.max(1,Math.min(50,+t.value||1));return;}
    if(t.id==='ev-day'){d.day=+t.value;return;}
  }
  if(t.closest('.drawer'))drawerChange(t);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;renderGrid();return;}
  if(t.id==='qc-time'||t.id==='qc-cap'){previewCreate();return;}
  if(S.drawer&&S.drawer.type==='event'&&!S.drawer.id){
    const d=S.drawer.draft;
    if(t.id==='ev-name')d.name=t.value;
    if(t.id==='ev-notes')d.notes=t.value;
    if(t.id==='ev-time'){d.range=t.value;const r=parseRange(t.value);const h=$('#ev-help');if(h){h.className='help span2'+(r?' okc':' err');h.textContent=r?fmtLong(r.s)+' – '+fmtLong(r.e):'Use a time range like 4p-11p.';}}
  }
  if(t.id==='dr-time'){const r=parseRange(t.value);const h=$('#dr-time-help');if(h){h.className='help span2'+(r?'':' err');h.textContent=r?fmtLong(r.s)+' – '+fmtLong(r.e)+' · press Enter to apply':'Use a range like 9-5, 4p-11p or 6-2.';}}
});
document.addEventListener('keydown',e=>{
  const t=e.target;const inField=/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName);
  if(S.pop&&t.closest&&t.closest('#pop')){
    if(e.key==='Enter'&&t.tagName!=='SELECT'){e.preventDefault();commitCreate();return;}
    if(e.key==='Escape'){e.preventDefault();const a=S.pop.anchor;closePop();if(a){const c=document.querySelector(`.c[data-r="${a.dataset.r}"][data-c="${a.dataset.c}"]`);if(c)c.focus();}return;}
    return;
  }
  if(e.key==='Enter'&&t.id==='dr-time'){e.preventDefault();drawerChange(t);return;}
  if(e.key==='Escape'){if(S.pop){closePop();return;}if(S.menu){S.menu=false;renderLayer();$('#toolsBtn').focus();return;}if(S.modal){S.modal=null;renderLayer();return;}if(S.drawer){S.drawer=null;renderLayer();return;}return;}
  if(inField||e.metaKey||e.ctrlKey)return;
  if(S.drawer||S.modal)return;
  const k=e.key;
  if(k==='?'){e.preventDefault();S.modal={type:'keys'};renderLayer();return;}
  if(k==='z'||k==='Z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  const cell=t.closest&&t.closest('#grid .c[data-day]');
  const chip=t.closest&&t.closest('#grid [data-chip]');
  if(k.startsWith('Arrow')&&cell){
    e.preventDefault();let r=+cell.dataset.r,c=+cell.dataset.c;
    if(k==='ArrowUp')r--;if(k==='ArrowDown')r++;if(k==='ArrowLeft')c--;if(k==='ArrowRight')c++;
    c=Math.max(0,Math.min(6,c));
    const n=document.querySelector(`#grid .c[data-r="${r}"][data-c="${c}"]`);
    if(n){$$('#grid .c[tabindex="0"]').forEach(x=>x.tabIndex=-1);n.tabIndex=0;n.focus();S.focus={r,c};n.scrollIntoView({block:'nearest',inline:'nearest'});}
    return;
  }
  if(k==='Enter'&&cell&&!chip){e.preventDefault();openCreate(cell);return;}
  if((k==='c'||k==='C')&&chip){S.clip={shiftId:chip.dataset.chip,pid:chip.dataset.pid||null};toast('Copied. Focus a cell and press V to paste.');return;}
  if((k==='v'||k==='V')&&cell&&S.clip){
    const x=shiftById(S.clip.shiftId);if(!x){toast('The copied shift is no longer in this week.');return;}
    const kind=cell.dataset.kind;if(kind!=='person'&&kind!=='open'){toast('Paste into a person or the Open shifts row.');return;}
    dropOn({shiftId:x.id,pid:S.clip.pid},{day:+cell.dataset.day,pid:kind==='person'?cell.dataset.pid:null},true);return;
  }
  if((k==='Delete'||k==='Backspace')&&chip){
    e.preventDefault();const x=shiftById(chip.dataset.chip);if(!x||x.cancel)return;const pid=chip.dataset.pid||null;snapshot();
    if(pid&&x.cap>1&&x.status==='draft'){x.who=x.who.filter(p=>p!==pid);x.cap-=1;}
    else if(pid&&x.cap>1){removePerson(x,pid);x.cap=Math.max(1,x.cap-1);}
    else if(!pid&&x.cap-x.who.length>0&&x.cap>1){touch(x);x.cap-=1;}
    else deleteShift(x);
    render();toast(x.status==='draft'?'Deleted.':'Removed. Staff hear about it when you publish.','undo');return;
  }
  if(k==='n'||k==='N'){
    e.preventDefault();const d=cell?+cell.dataset.day:(S.focus.c||0);
    const target=document.querySelector(`#grid .c[data-kind="open"][data-day="${d}"]`)||document.querySelector(`#grid .c[data-kind="role"][data-day="${d}"]`);
    if(target){target.focus();openCreate(target);}return;
  }
});

/* drag and drop */
const grid=$('#grid');
function clearDrop(){$$('#grid .drop-ok,#grid .drop-warn,#grid .drop-block').forEach(c=>{c.classList.remove('drop-ok','drop-warn','drop-block');c.removeAttribute('data-msg');});}
grid.addEventListener('dragstart',e=>{
  const chip=e.target.closest&&e.target.closest('[data-chip][draggable="true"]');if(!chip)return;
  const x=shiftById(chip.dataset.chip);if(!x||x.cancel){e.preventDefault();return;}
  S.drag={shiftId:chip.dataset.chip,pid:chip.dataset.pid||null};closePop();
  e.dataTransfer.effectAllowed='copyMove';try{e.dataTransfer.setData('text/plain',chip.dataset.chip);}catch(_){}
  requestAnimationFrame(()=>chip.classList.add('dragging'));
});
grid.addEventListener('dragend',()=>{S.drag=null;clearDrop();$$('#grid .dragging').forEach(c=>c.classList.remove('dragging'));});
grid.addEventListener('dragover',e=>{
  if(!S.drag)return;const cell=e.target.closest('.c[data-day]');if(!cell)return;
  const kind=cell.dataset.kind;if(kind!=='person'&&kind!=='open')return;
  e.preventDefault();const copy=e.altKey;e.dataTransfer.dropEffect=copy?'copy':'move';
  const x=shiftById(S.drag.shiftId);if(!x)return;
  const day=+cell.dataset.day,pid=kind==='person'?cell.dataset.pid:null;
  let cls='drop-ok',msg=copy?'Copy here':'Move here';
  if(pid){
    const probe=Object.assign({},x,{day,id:copy?'__probe':x.id});
    const f=conflictsFor(pid,probe,{exceptId:(!copy&&S.drag.pid===pid)?x.id:undefined});
    if(x.who.includes(pid)&&day===x.day&&S.drag.pid!==pid){cls='drop-block';msg='Already on it';}
    else if(f.some(c=>c.sev==='block')){cls='drop-block';msg=f.find(c=>c.sev==='block').text;}
    else if(f.length){cls='drop-warn';msg=f[0].text;}
  }else{msg=copy?'Copy as open':'Make it open';}
  if(!cell.classList.contains(cls)||cell.dataset.msg!==msg){clearDrop();cell.classList.add(cls);cell.dataset.msg=msg;}
});
grid.addEventListener('dragleave',e=>{const cell=e.target.closest('.c[data-day]');if(cell&&!cell.contains(e.relatedTarget)){cell.classList.remove('drop-ok','drop-warn','drop-block');cell.removeAttribute('data-msg');}});
grid.addEventListener('drop',e=>{
  if(!S.drag)return;const cell=e.target.closest('.c[data-day]');if(!cell)return;e.preventDefault();
  const kind=cell.dataset.kind;const drag=S.drag;S.drag=null;clearDrop();
  if(kind!=='person'&&kind!=='open')return;
  dropOn(drag,{day:+cell.dataset.day,pid:kind==='person'?cell.dataset.pid:null},e.altKey);
});
window.addEventListener('resize',()=>{if(S.pop&&S.pop.anchor&&document.body.contains(S.pop.anchor))placePop(S.pop.anchor);if(S.menu){S.menu=false;renderLayer();}});

render();
})();
</script>
</body></html>
