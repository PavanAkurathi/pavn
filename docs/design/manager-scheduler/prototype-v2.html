<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Horizon Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: one canvas, three zooms. A 6-week coverage strip sits above every view;
   Day, Week and Month share one date. Desktop = grid + inspector panel; phone = day-centric
   lists + bottom sheets. There is no drag anywhere: select, act, place. */
:root {
  --font: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --bg: #F3F4F8; --surface: #FFFFFF; --surface-2: #EEF0F5; --surface-3: #E3E6EE;
  --ink: #141B2D; --ink-2: #444E66; --muted: #66708A;
  --line: #E0E3EB; --line-2: #C9CEDA;
  --primary: #D92B3A; --primary-ink: #FFFFFF; --primary-soft: #FBE9EB;
  --navy: #182540;
  --focus: #2A78D6;
  /* status: fixed, never themed; always paired with text or an icon */
  --ok: #0CA30C; --warn: #FAB219; --ser: #EC835A; --crit: #D03B3B;
  --ok-text: #0B6B0B; --warn-text: #8A5300; --crit-text: #B3202C;
  /* roles: categorical slots 1-5 in order */
  --r-server: #2A78D6; --r-bartender: #EB6834; --r-cook: #1BAF7A; --r-host: #EDA100; --r-dish: #E87BA4;
  --shadow: 0 1px 2px rgba(20,27,45,.06), 0 4px 14px rgba(20,27,45,.08);
  --shadow-lg: 0 12px 44px rgba(20,27,45,.26);
  --scrim: rgba(14,19,32,.46);
  --frame: #0D1220;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0D1220; --surface: #141B2C; --surface-2: #1B2337; --surface-3: #25304A;
    --ink: #EEF1F8; --ink-2: #BCC4D6; --muted: #8F99B0;
    --line: #242D44; --line-2: #354262;
    --primary-soft: #3A1A20;
    --focus: #6DA7EC;
    --ok-text: #5CD65C; --warn-text: #F2B84B; --crit-text: #FF8A93;
    --r-server: #3987E5; --r-bartender: #D95926; --r-cook: #199E70; --r-host: #C98500; --r-dish: #D55181;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
    --shadow-lg: 0 12px 44px rgba(0,0,0,.6);
    --scrim: rgba(0,0,0,.6);
    --frame: #000000;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0D1220; --surface: #141B2C; --surface-2: #1B2337; --surface-3: #25304A;
  --ink: #EEF1F8; --ink-2: #BCC4D6; --muted: #8F99B0;
  --line: #242D44; --line-2: #354262;
  --primary-soft: #3A1A20;
  --focus: #6DA7EC;
  --ok-text: #5CD65C; --warn-text: #F2B84B; --crit-text: #FF8A93;
  --r-server: #3987E5; --r-bartender: #D95926; --r-cook: #199E70; --r-host: #C98500; --r-dish: #D55181;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
  --shadow-lg: 0 12px 44px rgba(0,0,0,.6);
  --scrim: rgba(0,0,0,.6);
  --frame: #000000;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.4 var(--font); -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%; overscroll-behavior: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: not-allowed; opacity: .5; }
input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }

/* ---------- stage: preview bar + device ---------- */
.stage { height: 100%; display: flex; flex-direction: column; min-width: 0; }
.pbar {
  flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 16px; background: var(--frame); color: #C9D0E2; font-size: 12px;
}
.pbar b { color: #fff; font-weight: 600; letter-spacing: .01em; }
.pbar .grp { display: inline-flex; background: #ffffff1a; border-radius: 8px; padding: 2px; }
.pbar .grp button { padding: 4px 10px; border-radius: 6px; color: #C9D0E2; min-height: 28px; }
.pbar .grp button[aria-pressed="true"] { background: #fff; color: #141B2D; font-weight: 600; }
.pbar .sp { flex: 1; }
.pbar .hint { color: #9AA5C0; }
.device { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: stretch; }
.stage[data-frame="1"] .device { align-items: center; padding: 16px; background: var(--surface-2); }
.app {
  position: relative; display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); width: 100%; height: 100%; min-width: 0;
}
.stage[data-frame="1"] .app {
  width: 390px; height: min(100%, 812px); border-radius: 34px;
  border: 8px solid var(--frame); box-shadow: var(--shadow-lg);
}

/* ---------- buttons & small parts ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 36px; padding: 0 14px; border-radius: 9px; font-weight: 600; font-size: 13.5px;
  border: 1px solid var(--line-2); background: var(--surface); white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.pri:hover { filter: brightness(1.07); background: var(--primary); }
.btn.pri[disabled] { background: var(--surface-3); color: var(--muted); border-color: var(--line); opacity: 1; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 13px; }
.btn.warnb { border-color: var(--warn-text); color: var(--warn-text); }
.btn.block { width: 100%; }
.iconbtn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; border: 1px solid transparent; }
.iconbtn:hover { background: var(--surface-2); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; min-width: 0; }
.seg button { padding: 0 14px; min-height: 32px; border-radius: 8px; font-weight: 600; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tog { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: 13px; }
.tog .sw { width: 28px; height: 16px; border-radius: 9px; background: var(--line-2); position: relative; transition: background .15s; }
.tog .sw::after { content: ''; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .15s; }
.tog[aria-pressed="true"] { border-color: var(--ink); }
.tog[aria-pressed="true"] .sw { background: var(--ink); }
.tog[aria-pressed="true"] .sw::after { transform: translateX(12px); background: var(--surface); }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.tag.draft { background: repeating-linear-gradient(135deg, transparent 0 4px, var(--line-2) 4px 5px), var(--surface-2); }
.tag.crit { background: var(--crit); color: #fff; }
.tag.warn { background: color-mix(in srgb, var(--warn) 30%, var(--surface)); color: var(--warn-text); }
.tag.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); color: var(--ok-text); }
.badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; }
.av { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; flex: none;
  background: color-mix(in srgb, var(--rc, var(--muted)) 14%, var(--surface)); color: var(--ink);
  box-shadow: inset 0 0 0 2px var(--rc, var(--muted)); font-size: 11.5px; font-weight: 700; }
.av.sm { width: 24px; height: 24px; font-size: 10px; }
h2, h3 { margin: 0; }
.muted { color: var(--muted); }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- top bar ---------- */
.top { flex: none; display: flex; align-items: center; gap: 14px; height: 54px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: -.01em; min-width: 0; }
.logo .mk { width: 28px; height: 28px; border-radius: 8px; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 13px; flex: none; }
.tabs { display: flex; gap: 2px; margin-left: 10px; }
.tab { position: relative; padding: 0 12px; height: 54px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink-2); }
.tab[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--primary); }
.tab:hover { color: var(--ink); }
.loc { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; padding: 0 10px; min-height: 34px; border-radius: 9px; border: 1px solid var(--line-2); }

/* ---------- horizon strip ---------- */
.strip { flex: none; display: flex; align-items: flex-end; gap: 12px; padding: 8px 16px 6px; background: var(--surface); border-bottom: 1px solid var(--line); }

/* ---------- toolbar ---------- */
.tb { flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 16px; background: var(--bg); }
.tb .dn { display: inline-flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 2px; }
.tb .dn .lbl { min-width: 128px; text-align: center; font-weight: 700; font-size: 13.5px; }
.tb .sp { flex: 1; }
.att { flex: none; margin: 0 16px 8px; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); width: calc(100% - 32px); }
.att .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
.att.clear .dot { background: var(--ok); }
.att .chev { color: var(--muted); }

/* ---------- main: canvas + inspector ---------- */
.main { flex: 1; min-height: 0; display: flex; }
.cwrap { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.canvas { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
.pad { padding: 4px 16px 130px; }
.insp { flex: none; width: 332px; border-left: 1px solid var(--line); background: var(--surface); overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.insp h3 { font-size: 15px; letter-spacing: -.01em; }
.isec { display: flex; flex-direction: column; gap: 8px; }
.isec > .cap, .cap-l { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.li { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); text-align: left; }
.li:hover { background: var(--surface-2); }
.li .n { font-weight: 700; min-width: 20px; }
.li .sub { font-size: 12.5px; color: var(--muted); }
.li.crit { border-color: color-mix(in srgb, var(--crit) 50%, var(--line)); }
.callout { display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 13px; }
.callout.crit { background: color-mix(in srgb, var(--crit) 9%, var(--surface)); }
.callout.warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); }
.gl { width: 18px; height: 18px; flex: none; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; background: var(--crit); }
.gl.w { background: var(--warn); color: #3a2600; }
.gl.o { background: var(--ok); }

/* ---------- action bar & place banner ---------- */
.abar {
  position: absolute; z-index: 20; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px; max-width: calc(100% - 24px); padding: 8px 10px;
  background: var(--navy); color: #fff; border-radius: 14px; box-shadow: var(--shadow-lg);
}
.abar .who { display: flex; align-items: center; gap: 8px; padding: 0 6px 0 2px; min-width: 0; }
.abar .who .t { font-weight: 700; font-size: 13px; line-height: 1.15; }
.abar .who .s { font-size: 11.5px; opacity: .75; }
.abar .acts { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.abar .acts::-webkit-scrollbar { display: none; }
.abar .ab { min-height: 40px; padding: 0 12px; border-radius: 9px; font-weight: 600; font-size: 13.5px; color: #fff; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.abar .ab:hover { background: #ffffff22; }
.abar .ab.dng { color: #FFB3B9; }
.abar .ab.pri { background: var(--primary); }
.abar .x { color: #fff; opacity: .8; }
.pbanner { flex: none; margin: 0 16px 8px; padding: 10px 12px; border-radius: 12px; background: var(--navy); color: #fff; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pbanner .t { font-weight: 700; }
.pbanner .s { font-size: 12.5px; opacity: .8; }
.pbanner .dchips { display: flex; gap: 4px; flex-wrap: wrap; }
.pbanner .dc { min-height: 32px; min-width: 42px; padding: 0 8px; border-radius: 8px; border: 1px solid #ffffff44; font-weight: 600; font-size: 12.5px; color: #fff; }
.pbanner .dc[aria-pressed="true"] { background: #fff; color: var(--navy); border-color: #fff; }
.pbanner .btn { border-color: #ffffff55; background: transparent; color: #fff; }
.pbanner .btn.pri { background: var(--primary); border-color: var(--primary); }

/* ---------- chips (the three marks: draft stripes, open dashed, problem !) ---------- */
.chip {
  position: relative; display: flex; align-items: center; gap: 6px; width: 100%; min-height: 28px; padding: 2px 8px 2px 8px;
  border-radius: 7px; border: 1px solid color-mix(in srgb, var(--rc) 32%, var(--line));
  border-left: 3px solid var(--rc);
  background: color-mix(in srgb, var(--rc) 13%, var(--surface));
  font-size: 12.5px; font-weight: 600; line-height: 1.2; text-align: left; white-space: nowrap;
}
.chip .tm { font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
.chip .rl { font-weight: 500; color: var(--ink-2); }
.chip small { font-weight: 500; color: var(--ink-2); font-size: 11.5px; }
.chip.draft { background-image: repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--rc) 20%, transparent) 5px 7px); }
.chip.open { background: var(--surface); border-style: dashed; border-color: color-mix(in srgb, var(--rc) 60%, var(--line-2)); border-left-style: solid; color: var(--ink); }
.chip.prob { box-shadow: 0 0 0 1.5px var(--crit); }
.chip .pm { position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; background: var(--crit); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; }
.chip.sel { box-shadow: 0 0 0 2px var(--ink); z-index: 2; }
.chip.dim, .dimmable.dim { opacity: .3; }
.chip.mon::after { content: ''; position: absolute; right: 6px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 4px; border: 2px solid var(--ink-2); background: var(--surface); }
.chip.mon.on::after { background: var(--ink); border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--surface); }
.plus { min-height: 22px; padding: 0 6px; border-radius: 6px; font-size: 12px; font-weight: 700; color: var(--ink-2); text-align: left; }
.plus:hover { background: var(--surface-2); }

/* ---------- week grid (desktop) ---------- */
.wg { display: grid; grid-template-columns: 188px repeat(7, minmax(112px, 1fr)) 76px; min-width: 1000px; position: relative; }
.wg > * { min-width: 0; }
.wg .hd { position: sticky; top: 0; z-index: 4; background: var(--bg); padding: 8px 6px 8px; }
.wg .hd.dh { display: flex; flex-direction: column; gap: 5px; text-align: left; border-radius: 10px; }
.wg .hd.dh:hover { background: var(--surface-2); }
.wg .dh .d { display: flex; align-items: baseline; gap: 6px; font-weight: 700; }
.wg .dh .d span { color: var(--muted); font-weight: 600; font-size: 12px; }
.wg .dh.today .d b { background: var(--primary); color: #fff; border-radius: 6px; padding: 0 6px; }
.wg .dh .meta { display: flex; align-items: center; gap: 6px; min-height: 18px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.wg .corner { left: 0; z-index: 5; display: flex; align-items: center; }
.wg .corner input { width: 100%; min-height: 34px; border: 1px solid var(--line-2); border-radius: 9px; padding: 0 10px; background: var(--surface); }
.wg .lab { position: sticky; left: 0; z-index: 3; background: var(--bg); display: flex; align-items: center; gap: 10px; padding: 4px 8px 4px 0; min-height: 52px; border-top: 1px solid var(--line); }
.wg .lab .nm { font-weight: 600; line-height: 1.2; }
.wg .lab .rr { font-size: 12px; color: var(--muted); }
.wg .cell { border-top: 1px solid var(--line); padding: 5px 3px; display: flex; flex-direction: column; gap: 4px; min-height: 52px; cursor: cell; position: relative; }
.wg .cell:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.wg .cell.opencell { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.wg .hrs { border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: flex-end; padding-right: 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.wg .hrs.near { color: var(--warn-text); }
.wg .hrs.over { color: var(--crit-text); }
.wg .dept { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 10px 0 6px; border-top: 1px solid var(--line); }
.wg .dept button { display: flex; align-items: center; gap: 8px; font-weight: 700; min-height: 32px; }
.wg .dept .sm { font-weight: 500; color: var(--muted); font-size: 12.5px; }
.off { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--surface-3); color: var(--ink-2); font-size: 12px; font-weight: 600; }
.off.pend { background: transparent; border: 1px dashed var(--line-2); }
/* place mode hints */
.wg .cell.h-ok, .wg .cell.h-warn, .wg .cell.h-block, .wg .cell.picked { cursor: pointer; }
.wg .cell.h-ok { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--ok) 70%, transparent); background: color-mix(in srgb, var(--ok) 8%, var(--surface)); }
.wg .cell.h-warn { box-shadow: inset 0 0 0 2px var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--surface)); }
.wg .cell.h-block { box-shadow: inset 0 0 0 2px var(--crit); background: color-mix(in srgb, var(--crit) 8%, var(--surface)); }
.wg .cell.picked { box-shadow: inset 0 0 0 2px var(--ink); background: color-mix(in srgb, var(--ink) 8%, var(--surface)); }
.wg .cell .hg { position: absolute; top: 4px; right: 4px; height: 18px; padding: 0 6px; border-radius: 9px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 3px; background: var(--surface); box-shadow: 0 0 0 1px var(--line-2); max-width: calc(100% - 8px); }
.wg.placing .cell:not(.h-ok):not(.h-warn):not(.h-block):not(.picked) { opacity: .45; }

/* ---------- phone: week rows, people rows ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.wrow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); text-align: left; }
.wrow.today { border-color: var(--ink); }
.wrow .dd { width: 46px; flex: none; line-height: 1.1; }
.wrow .dd b { display: block; font-size: 17px; }
.wrow .dd span { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.wrow .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.wrow .mid .r { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.wrow .chev, .prow .chev { color: var(--muted); flex: none; }
.wrow .draftmark { width: 4px; align-self: stretch; border-radius: 3px; background: repeating-linear-gradient(135deg, var(--ink-2) 0 3px, transparent 3px 6px); flex: none; }
.prowk { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 60px; padding: 8px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: left; }
.prowk .hh { margin-left: auto; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.prowk .hh.near { color: var(--warn-text); } .prowk .hh.over { color: var(--crit-text); }

/* ---------- day view ---------- */

    h += `<section class="dp" aria-label="${pn}"><div class="dph"><span class="t">${pn}</span><span class="tt">${span}</span><span class="cnt num">${fl} of ${items.length}</span></div><div class="list" style="gap:6px">${items.filter(s => s.p).map(prow).join('')}${openGroups(items).map(orow).join('')}</div></section>`;
  }
  QUIET = false;
  return h + '</div></div>';
}

/* ---------- phone: week ---------- */

function peopleRows() {
  const dates = weekDates(), wk = wkOf(S.date);

    const worked = dates.filter(d => mine(d).length).map(d => DOW[dowOf(d)]);

    const tags = `${probd.length ? `<span class="tag crit">! ${probd.join(', ')}</span>` : ''}${anyDraft ? '<span class="tag draft">Draft</span>' : ''}${offd.length ? `<span class="off">Off ${offd.join(', ')}</span>` : ''}`;

}

/* ---------- month: a calendar of numbers, plus a list view ---------- */
function monthHTML() {
  const first = monthStart(S.date), last = addDays(addMonths(first, 1), -1), ym = first.slice(0, 7);
  const rows = []; let st = wkStart(wkOf(first));
  while (st <= last) { rows.push(st); st = addDays(st, 7); }
  let live = 0, dr = 0, none = 0, openN = 0;
  for (const s of rows) { const w = wkStats(wkOf(s)); if (!w.cap) none++; else if (w.drafts) dr++; else live++; for (let i = 0; i < 7; i++) { const d = addDays(s, i); if (d.slice(0, 7) === ym) openN += dayStats(d).open; } }
  const bits = [live && `${live} live`, dr && `${dr} with drafts`, none && `${none} not started`, openN && `${openN} open slots`].filter(Boolean);
  const lens = [['cov', 'Coverage'], ['off', 'Time off'], ['ev', 'Events'], ['dr', 'Drafts']];
  let h = `<div class="pad"><div class="msum"><b>${MONTHS[monthNum(first) - 1]}</b><span>${bits.join(' · ')}</span></div>
    <div class="mlens" role="group" aria-label="Month lens">${lens.map(([k, l]) => `<button class="chipb" data-act="mlens" data-k="${k}" aria-pressed="${S.mlens === k}">${l}</button>`).join('')}<span class="grow"></span><button class="chipb" data-act="mtable" aria-pressed="${S.mtable}">List</button></div>`;
  if (S.mtable) {
    h += `<div class="tblwrap"><table class="mtbl"><thead><tr><th>Date</th><th>Filled</th><th>Open</th><th>Status</th><th>Event</th></tr></thead><tbody>`;
    for (let d = first; d <= last; d = addDays(d, 1)) {
      const s = dayStats(d), ev = S.events.find(e => e.date === d);
      h += `<tr><td><button data-act="mday" data-date="${d}" style="font-weight:600">${fmtD(d)}</button></td><td class="num">${s.cap ? `${s.filled} of ${s.cap}` : '—'}</td><td class="num">${s.open || '—'}</td><td>${!s.cap ? 'Not scheduled' : s.drafts ? 'Draft' : 'Published'}${s.prob ? ' · problem' : ''}</td><td>${ev ? esc(ev.name) : ''}</td></tr>`;
    }
    return h + '</tbody></table></div></div>';
  }
  h += `<div class="mg"><span></span>${DOW.map(d => `<span class="dow">${d[0]}<span class="desk-only">${d.slice(1)}</span></span>`).join('')}`;
  for (const s of rows) {
    const w = wkStats(wkOf(s)), k = !w.cap ? 'none' : w.drafts ? 'dr' : 'live';
    h += `<button class="mw ${k}" data-act="wkopen" data-date="${s}" aria-label="Open week of ${esc(weekLabel(s))}: ${k === 'none' ? 'not started' : k === 'dr' ? w.drafts + ' drafts' : 'live'}">${k === 'none' ? 'Not started' : k === 'dr' ? `${w.drafts} draft${w.drafts === 1 ? '' : 's'}` : 'Live'}</button>`;
    for (let i = 0; i < 7; i++) {
      const d = addDays(s, i), out = d.slice(0, 7) !== ym, ds = dayStats(d), ev = S.events.find(e => e.date === d);
      let body = '';
      if (!out) {
        if (S.mlens === 'cov') body = ds.cap ? (ds.open ? `<span class="ot warn">${ds.open} open</span>` : `<span class="ot">${ds.filled} on</span>`) : '';
        if (S.mlens === 'off') { const n = S.timeoff.filter(t => t.date === d).length; body = n ? `<span class="ot">${n} off</span>` : ''; }
        if (S.mlens === 'ev') body = ev ? `<span class="ot">${esc(ev.name.split(' ')[0])}</span>` : '';
        if (S.mlens === 'dr') body = ds.drafts ? `<span class="ot">${ds.drafts} draft${ds.drafts === 1 ? '' : 's'}</span>` : '';
      }
      const unp = !out && (S.mlens === 'dr' || S.mlens === 'cov') && ds.cap && ds.drafts;
      h += `<button class="mc${out ? ' out' : ''}${d === TODAY ? ' today' : ''}${unp ? ' unp' : ''}${S.sel && S.sel.kind === 'day' && S.sel.date === d ? ' sel' : ''}" data-act="mday" data-date="${d}" aria-label="${esc(fmtD(d))}: ${esc(tipText(ds))}"><span class="dn num">${dayNum(d)}</span>${!out && ev && S.mlens !== 'ev' ? '<b class="ev"></b>' : ''}${!out && S.mlens === 'ev' && ev ? '<b class="ev"></b>' : ''}${body}</button>`;
    }
  }
  const hint = { cov: '<span>Number on shift, or slots still open in orange</span><span>Dashed cell: has drafts</span><span>◆ event</span>', off: '<span>Number of people off</span>', ev: '<span>◆ event</span>', dr: '<span>Dashed cell: has drafts</span>' }[S.mlens];
  h += `</div><div class="lg" style="margin-top:14px">${hint}</div></div>`;
  return h;
}

/* ---------- inbox, people, time, more ---------- */

function dayPanel(date) {

    return doMove(x.id, x.p, d, c.level === 'warn' ? c.msgs[0] : '');
  }
  const list = dedupe(x, [...sh.days].map(d => ({ p: x.p, date: d })));
  M.copy(x.id, list); S.sheet = null; toast(`${list.length} ${list.length === 1 ? 'copy' : 'copies'} added as drafts`, true);
};
function copyMany(ids, days) {
  snap(); const out = [];
  for (const id of ids) { const x = byId(id); if (!x) continue; for (const d of days) { if (d === x.date) continue; if (on(d).some(z => z.p === x.p && z.s === x.s && z.e === x.e && z.role === x.role)) continue; out.push(newShift(d, x.s, x.e, x.role, x.p, false, x.ev)); } }
  S.shifts.push(...out); dirty(); return out.length;
}
A['multi-start'] = () => { S.multi = new Set(); S.sel = null; S.sheet = null; };
A['multi-cancel'] = () => { S.multi = null; };
A['multi-del'] = () => { const ids = [...S.multi]; M.delMany(ids); S.multi = null; toast(`${ids.length} ${ids.length === 1 ? 'shift' : 'shifts'} deleted`, true); };
A['multi-copy'] = () => { S.sheet = { type: 'mv', op: 'copy', ids: [...S.multi], days: new Set() }; };

/* ---------- give / add / edit ---------- */
A['give-to'] = el => {
  const id = el.dataset.id, p = el.dataset.p, sh = byId(id); if (!sh) return;
  const c = check(sh, p, sh.date);
  const go = () => { M.give(id, p); S.sheet = null; S.sel = { kind: 'shift', id }; toast(`${firstName(p)} now has ${fmtD(sh.date)} ${range(sh.s, sh.e)}${c.level === 'warn' ? ' · ' + c.msgs[0] : ''}`, true); };
  if (c.level === 'block') confirmThen(`Schedule ${firstName(p)} anyway?`, `${esc(c.msgs.join('. '))}. This is recorded in the audit log.`, 'Schedule anyway', go);
  else go();
};
function addHint(txt, id) {
  const el = $('#' + id); if (!el) return;
  const r = parseRange(txt);
  el.classList.toggle('bad', !!txt && !r);
  el.textContent = !txt ? 'Type a range, then press Add.' : r ? `${range(r.s, r.e)}${r.overnight ? ', ends next day' : ''} · ${fmtH(paid(r.s, r.e))} paid` : 'Not a time range. Try 9-5 or 4p-11p.';
}
function commitAdd(s, e) {
  const { p, date, n } = S.sheet, role = $('#add-role') ? $('#add-role').value : S.sheet.role;
  const c = p ? check({ id: 'new', s, e, role, date }, p, date) : { level: 'ok', msgs: [] };
  const go = () => {
    snap(); const made = [];
    for (let i = 0; i < (p ? 1 : n); i++) made.push(newShift(date, s, e, role, p, false));
    S.shifts.push(...made); dirty(); S.sheet = null; S.sel = { kind: 'shift', id: made[0].id };
    toast(`Added ${range(s, e)} ${role}${p ? ' for ' + firstName(p) : n > 1 ? ' ×' + n : ''}${c.level === 'warn' ? ' · ' + c.msgs[0] : ''}`, true);
  };
  if (c.level === 'block') confirmThen(`Schedule ${firstName(p)} anyway?`, `${esc(c.msgs.join('. '))}. This is recorded in the audit log.`, 'Schedule anyway', go);
  else go();
}
A['add-usual'] = el => commitAdd(+el.dataset.s, +el.dataset.e);
A['add-go'] = () => {
  const txt = $('#add-time').value, r = parseRange(txt);
  if (!r) { addHint(txt || '', 'add-hint'); const h = $('#add-hint'); if (h && !txt) { h.classList.add('bad'); h.textContent = 'Pick a usual shift or type a time first.'; } throw new Error('stay'); }
  commitAdd(r.s, r.e);
};
A['add-n'] = el => { S.sheet.n = Math.max(1, Math.min(20, S.sheet.n + +el.dataset.d)); };
A.more = el => M.more(el.dataset.id);
A.fewer = el => M.fewer(el.dataset.id);
A.usual = el => {
  const wk = +el.dataset.wk; S.sheet = null;
  if (wkStats(wk).cap) return toast('This week already has shifts');
  toast(`Added ${M.usual(wk)} open slots as drafts`, true);
};
A.copyweek = el => {
  const wk = +el.dataset.wk; S.sheet = null;
  if (wkStats(wk).cap) return toast('This week already has shifts. Copy last week works on an empty week.');
  toast(`Copied ${M.copyWeek(wk)} shifts from last week as drafts`, true);
};

/* ---------- publish, requests ---------- */
A.publish = () => {
  const r = S.zoom === 'month' ? [monthStart(S.date), addDays(addMonths(monthStart(S.date), 1), -1)] : spanRange();
  S.sheet = { type: 'publish', range: r };
};
A['publish-go'] = () => { const [a, b] = S.sheet.range, r = M.publish(a, b); S.sheet = null; toast(`Published. ${r.people} ${r.people === 1 ? 'person' : 'people'} notified`, true); };
A['req-yes'] = el => { const m = M.decide(el.dataset.id, true); toast(m, true); };
A['req-no'] = el => { M.decide(el.dataset.id, false); toast('Declined', true); };
A['time-ok'] = el => { M.approveTime(el.dataset.id); toast('Timesheet approved', true); };

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !$('#app').contains(el)) return;
  const fn = A[el.dataset.act];
  if (!fn || el.disabled) return;
  if (fn === A.scrim && e.target !== el) return;
  try { fn(el, e); } catch (err) { if (err.message !== 'stay') throw err; return; }
  render();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; render(); }
  else if (t.id === 'add-time' && S.sheet) { S.sheet.txt = t.value; addHint(t.value, 'add-hint'); }
  else if (t.id === 'f-time') addHint(t.value, 'f-hint');
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset && t.dataset.chg;
  if (!k) return;
  if (k === 'addrole') { S.sheet.role = t.value; return; }
  const sh = selShift(); if (!sh) return;
  if (k === 'time') {
    const r = parseRange(t.value);
    if (!r) { addHint(t.value, 'f-hint'); t.value = range(sh.s, sh.e); return; }
    M.patch(sh.id, { s: r.s, e: r.e }); toast(`Time set to ${range(r.s, r.e)}`, true);
  } else if (k === 'day') { M.patch(sh.id, { date: t.value }); S.date = t.value; toast(`Moved to ${fmtD(t.value)}`, true); }
  else if (k === 'role') { M.patch(sh.id, { role: t.value }); toast(`Role set to ${t.value}`, true); }
  render();
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'select' || tag === 'textarea';
  if (e.key === 'Escape') {
    if (S.sheet) S.sheet = null; else if (S.place) S.place = null; else if (S.multi) S.multi = null; else S.sel = null;
    render(); return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || S.sheet || S.tab !== 'schedule') return;
  const k = e.key.toLowerCase(), sh = selShift(); let done = true;
  if (k === 'z') A.undo();
  else if (['1', '2', '3'].includes(k)) { S.zoom = ['day', 'week', 'month'][+k - 1]; clearModes(); resetScroll = true; }
  else if (sh && !S.place && k === 'm') A['ab-move']();
  else if (sh && !S.place && k === 'c') A['ab-copy']();
  else if (sh && !S.place && k === 'g') A['ab-give']();
  else if (sh && !S.place && k === 'o' && sh.p) A['ab-open']();
  else if (sh && !S.place && (e.key === 'Delete' || e.key === 'Backspace')) A['ab-del']();
  else done = false;
  if (done) { e.preventDefault(); render(); }
});
/* long-press a shift to start selecting several (touch and mouse) */
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('[data-act="chip"]');
  if (!c || S.place || S.multi || S.tab !== 'schedule' || S.sheet) return;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => { S.multi = new Set([c.dataset.id]); S.sel = null; suppressClick = true; render(); }, 520);
});
['pointerup', 'pointercancel', 'pointerleave', 'scroll'].forEach(t => document.addEventListener(t, () => clearTimeout(pressTimer), true));
/* swallow only the click that follows the release of the long press, then listen again */
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => { if (suppressClick) setTimeout(() => { suppressClick = false; }, 80); }, true));
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-act="chip"]')) e.preventDefault(); });
/* tooltips (hover and focus only; every value is also in the aria-label and the table view) */
const tipEl = () => $('#tip');
function showTip(t) {
  const tip = tipEl(); tip.textContent = t.dataset.tip; tip.hidden = false;
  const r = t.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(innerWidth - 8 - tip.offsetWidth, r.left + r.width / 2 - tip.offsetWidth / 2)) + 'px';
  tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + 'px';
}
document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); else tipEl().hidden = true; });
document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); });
document.addEventListener('focusout', () => { tipEl().hidden = true; });
document.addEventListener('mouseleave', () => { tipEl().hidden = true; });

/* preview bar: device and theme */
$('.pbar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.dev) { S.layout = b.dataset.dev; S.frame = S.layout === 'phone' && innerWidth >= 900; S.manual = true; clearModes(); S.sheet = null; }
  if (b.dataset.th) { S.theme = b.dataset.th; S.themeTouched = true; }
  render();
});
addEventListener('resize', () => {
  if (innerWidth < 900) { S.layout = 'phone'; S.frame = false; }
  else if (!S.manual) { S.layout = 'desktop'; S.frame = false; }
  else S.frame = S.layout === 'phone';
  render();
});

/* ---------- boot ---------- */
seed(); dirty();
S.layout = innerWidth < 900 ? 'phone' : 'desktop';
if (S.layout === 'phone') S.zoom = 'day';
render();
})();</script></body></html>
