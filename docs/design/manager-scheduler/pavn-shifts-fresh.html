<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pavn — Shifts</title>
<style>
:root{
  --pri:#6366f1; --pri-d:#4f46e5; --pri-soft:rgba(99,102,241,.09);
  --bg:#f6f6f8; --surface:#fff; --text:#1b1b22; --muted:#6d6d7d; --faint:#a5a5b3;
  --border:#e4e4ea; --green:#10b981; --green-bg:#e7f8f1; --amber:#f59e0b; --amber-bg:#fdf3e3;
  --red:#ef4444; --red-bg:#fef1f1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:30px 26px 80px}
.kicker{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pri-d);margin-bottom:6px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:560px}
.btn-primary{font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 20px;border-radius:11px;border:none;background:var(--pri);color:#fff;cursor:pointer;box-shadow:0 3px 12px rgba(99,102,241,.3)}
.btn-primary:hover{background:var(--pri-d)}
.btn-primary.sm{padding:8px 15px;font-size:12.5px}
.btn-ghost{font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 15px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.btn-danger-ghost{font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 15px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer}
.btn-danger-ghost.confirm{background:var(--red);border-color:var(--red);color:#fff}
/* tabs */
.tabs{display:inline-flex;background:#ececf1;border-radius:12px;padding:4px;margin:22px 0 16px}
.tab{border:none;background:none;font-family:inherit;font-size:13.5px;font-weight:600;color:#55556a;padding:8px 22px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab.on{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.13);font-weight:700}
.tab .count{background:#d8d8e0;color:#3a3a48;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.filters{display:flex;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.filters select{font-family:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--border);border-radius:11px;padding:10px 14px;background:var(--surface);color:var(--text);cursor:pointer}
.tabpane{display:none}.tabpane.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
/* shift cards */
/* shift list: clean rows, grouped by date */
.datehdr{font-size:14.5px;font-weight:700;margin:24px 0 10px}
#tab-up .datehdr:first-child,#tab-past .datehdr:first-child{margin-top:4px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:12px;cursor:pointer;transition:box-shadow .14s}
.scard:hover{box-shadow:0 8px 24px rgba(20,16,60,.09)}
.scard .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.scard h3{font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.scard .econ{font-size:14.5px;font-weight:800;white-space:nowrap}
.scard .econ span{color:var(--muted);font-weight:600}
.scard .smeta{color:var(--muted);font-size:13.5px;margin-top:6px;line-height:1.7}
.scard hr{border:none;border-top:1px solid var(--border);margin:14px 0 12px}
.scard .r2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filldot{width:5px;height:20px;border-radius:99px;background:var(--green);flex:none}
.filldot.part{background:var(--amber)}
.sfill2{font-size:13.5px;font-weight:600}
.astack{display:flex;align-items:center;margin-left:4px}
.astack .av{width:30px;height:30px;font-size:11px;margin-left:-9px;border:2px solid #fff}
.astack .av:first-child{margin-left:0}
.astack .more{font-size:12.5px;color:var(--muted);font-weight:700;margin-left:8px}
.linklike{border:none;background:none;color:var(--pri-d);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;padding:0}
.linklike:hover{text-decoration:underline}
.linklike:disabled{opacity:.55;cursor:default;text-decoration:none}
.bookagain{margin-left:auto}
.fillbar{height:6px;background:#efedf7;border-radius:99px;margin:12px 0 5px;overflow:hidden}
.fillbar i{display:block;height:100%;background:#2b2b3e;border-radius:99px;transition:width .3s}
.pill{font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.pub{background:#eef0f2;color:#3a3a48}
.pill.dft{background:transparent;color:var(--muted);border:1.5px dashed #c4c4ce}
.bookbtn{font-family:inherit;font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:10px;border:1px solid var(--pri);background:var(--pri);color:#fff;cursor:pointer;margin-top:12px;width:100%}
.bookbtn:disabled{opacity:.6;cursor:default;background:var(--green);border-color:var(--green)}
/* draft groups */
.dgroup{background:var(--surface);border:1.5px dashed #d4d4dc;border-radius:16px;margin-bottom:14px;overflow:hidden}
.dg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 20px;cursor:pointer;flex-wrap:wrap}
.dg-h:hover{background:#fafaff}
.dg-h h3{font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:10px}
.dg-h .ddot{width:9px;height:9px;border-radius:50%;background:#3a3a48}
.dpsub{font-size:12.5px;color:var(--muted);margin-top:3px}
.dg-actions{display:flex;gap:8px;flex-wrap:wrap}
.dg-body{border-top:1px dashed var(--border);padding:8px 20px 14px}
.dshift{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.dshift:last-child{border-bottom:none}
.dshift .t{flex:1}.dshift .t b{display:block;font-size:13.5px}.dshift .t span{color:var(--muted);font-size:12px}
.dempty{background:var(--surface);border:1.5px dashed var(--border);border-radius:16px;padding:44px 20px;text-align:center;color:var(--muted)}
.dempty .big{font-size:34px;margin-bottom:10px}
.dempty b{color:var(--text);display:block;font-size:15px;margin-bottom:5px}
/* details overlay */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:60;overflow-y:auto;display:none}
.overlay.open{display:block;animation:fade .18s ease}
.sheet-page{max-width:720px;margin:0 auto;padding:26px 22px 90px}
.backlink{font-family:inherit;border:none;background:none;color:var(--pri-d);font-size:13.5px;font-weight:700;cursor:pointer;margin-bottom:16px;padding:6px 0}
.d-head h2{font-size:23px;font-weight:800;letter-spacing:-.01em;margin:8px 0 6px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.d-meta{color:var(--muted);font-size:13.5px;line-height:1.7}
.d-econ{font-size:15px;font-weight:800;margin-top:10px}
.d-econ span{color:var(--muted);font-weight:600}
.d-sec{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-top:16px}
.d-sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.d-sec h3{font-size:15px;font-weight:800}
.d-sec p{color:var(--muted);font-size:13.5px;margin-top:8px;line-height:1.65}
.srow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:none}
.srow.open{cursor:pointer;border:1.5px dashed #d4d4dc;border-radius:12px;padding:11px 12px;margin-top:8px}
.srow.open:hover{background:var(--pri-soft);border-color:var(--pri)}
.av{width:38px;height:38px;border-radius:50%;background:#ececf1;color:#4a4a5c;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.av.empty{background:transparent;border:2px dashed #c9c8da;color:var(--faint);font-size:18px}
.sinfo{flex:1;min-width:0}
.sinfo b{font-size:13.5px;display:block}
.sinfo span{font-size:12px;color:var(--muted)}
.iconbtn{border:none;background:#f0eff6;width:28px;height:28px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:12px;font-family:inherit;flex:none}
.iconbtn:hover{background:var(--red-bg);color:var(--red)}
.go{color:var(--pri);font-size:20px;font-weight:800}
/* roster table (shift details) */
.twrap{overflow-x:auto;margin:14px -20px 0;padding:0 20px}
.rostertbl{width:100%;border-collapse:collapse;min-width:640px}
.rostertbl th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:10px;border-bottom:1px solid var(--border);white-space:nowrap}
.rostertbl td{padding:12px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.rostertbl tbody tr:last-child td{border-bottom:none}
.tname{display:flex;align-items:center;gap:12px}
.tname b{display:block;font-size:14px}
.tname span{font-size:12px;color:var(--muted)}
.tbox{display:inline-block;background:#f1f1f4;border-radius:9px;padding:8px 14px;font-size:13px;color:var(--muted);min-width:92px;text-align:center}
.tact{width:48px;text-align:right}
.mapbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.mapbtn:hover{color:var(--pri-d);border-color:var(--pri)}
.tslot td{padding:7px 10px}
.tslot .slotin{display:flex;align-items:center;gap:12px;border:1.5px dashed #d4d4dc;border-radius:12px;padding:9px 14px;cursor:pointer}
.tslot .slotin:hover{background:var(--pri-soft);border-color:var(--pri)}
.slotin b{font-size:13.5px;display:block}
.slotin .ssub{font-size:12px;color:var(--muted)}
.d-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.d-actions .danger{margin-left:auto;color:var(--red);border-color:#f3c2c2}
/* picker sheet */
.scrim{position:fixed;inset:0;background:rgba(20,16,60,.4);z-index:70;display:none}
.scrim.open{display:block}
.picker{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(105%);width:min(560px,100vw);max-height:84vh;background:var(--surface);border-radius:20px 20px 0 0;z-index:71;transition:transform .26s ease;display:flex;flex-direction:column;overflow:hidden}
.picker.open{transform:translateX(-50%) translateY(0)}
.pk-h{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 22px 12px}
.pk-h h3{font-size:17px;font-weight:800}
.xbtn{border:none;background:#f0eff6;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;color:var(--muted);font-family:inherit;flex:none}
.pk-tools{padding:0 22px 12px;display:flex;flex-direction:column;gap:10px}
.pk-tools input{font-family:inherit;font-size:13.5px;border:1px solid var(--border);border-radius:11px;padding:11px 14px;width:100%}
.fchips{display:flex;gap:7px;flex-wrap:wrap}
.fchip{border:1px solid var(--border);background:var(--surface);font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);padding:7px 14px;border-radius:99px;cursor:pointer}
.fchip.on{background:#e8e8ee;color:var(--text);border-color:#d4d4dc}
.pk-list{overflow-y:auto;padding:4px 12px 20px}
.prow{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:12px;cursor:pointer}
.prow:hover{background:#fafaff}
.avail{font-size:11px;font-weight:800;padding:4px 11px;border-radius:99px;white-space:nowrap}
.avail.ok{background:var(--green-bg);color:#067647}
.avail.warn{background:var(--amber-bg);color:#92400e}
/* create modal */
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.96);width:min(480px,92vw);background:var(--surface);border-radius:20px;z-index:71;padding:26px;opacity:0;pointer-events:none;transition:all .2s}
.modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal h3{font-size:18px;font-weight:800;margin-bottom:4px}
.modal .sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.frow{margin-bottom:13px}
.frow label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.frow input,.frow select{font-family:inherit;font-size:13.5px;border:1px solid var(--border);border-radius:11px;padding:11px 13px;width:100%;background:#fff;color:var(--text)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-actions{display:flex;gap:10px;margin-top:20px}
.m-actions .btn-primary{flex:1}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#221f33;color:#fff;font-size:13.5px;font-weight:600;padding:13px 24px;border-radius:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:92vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast b{color:#a5b4fc}
@media(max-width:640px){.wrap{padding:20px 14px 70px}.d-actions .danger{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Pavn · Shifts</div>
  <div class="topbar">
    <div>
      <h1>Shifts</h1>
      <p class="lede">A clean list, grouped by date. Drafts stay in their own tab — they never pile up inside Upcoming.</p>
    </div>
    <button class="btn-primary" onclick="openCreate()">＋ New shift</button>
  </div>

  <div class="tabs">
    <button class="tab on" data-t="up" onclick="switchTab('up')">Upcoming</button>
    <button class="tab" data-t="drafts" onclick="switchTab('drafts')">Drafts <span class="count" id="draftCount">2</span></button>
    <button class="tab" data-t="past" onclick="switchTab('past')">Past</button>
  </div>

  <div class="filters">
    <select id="fLoc" onchange="applyFilters()"><option value="">Locations</option><option>Downtown Venue</option><option>Charles Catering</option></select>
    <select id="fDate" onchange="applyFilters()"><option value="">Start/End Date(s)</option><option value="7">Next 7 days</option><option value="30">Next 30 days</option></select>
  </div>

  <section id="tab-up" class="tabpane on"><div id="upGrid"></div></section>
  <section id="tab-drafts" class="tabpane"><div id="draftList"></div></section>
  <section id="tab-past" class="tabpane"><div id="pastGrid"></div></section>
</div>

<!-- shift details -->
<div class="overlay" id="detailsOv"><div class="sheet-page">
  <button class="backlink" onclick="closeDetails()">‹ Shifts</button>
  <div id="detailsBody"></div>
</div></div>

<!-- roster picker -->
<div class="scrim" id="scrim" onclick="closePicker()"></div>
<div class="picker" id="picker">
  <div class="pk-h"><div><h3>Add worker</h3><div class="dpsub" id="pkSub" style="font-size:12.5px;color:var(--muted)"></div></div><button class="xbtn" onclick="closePicker()">✕</button></div>
  <div class="pk-tools">
    <input id="pkSearch" placeholder="Search roster…" oninput="renderPicker()">
    <div class="fchips" id="pkFilters"></div>
  </div>
  <div class="pk-list" id="pkList"></div>
</div>

<!-- quick create -->
<div class="scrim" id="scrim2" onclick="closeCreate()"></div>
<div class="modal" id="createModal">
  <h3>New shift</h3>
  <div class="sub">Starts as a draft — publish when it's ready, or publish right away.</div>
  <div class="frow"><label>Event / shift title</label><input id="cTitle" placeholder="e.g. Smith Wedding" value=""></div>
  <div class="f2">
    <div class="frow"><label>Role</label><select id="cRole"><option>Server</option><option>Bartender</option><option>Event Server</option><option>Prep Cook</option><option>Sommelier</option></select></div>
    <div class="frow"><label>Location</label><select id="cLoc"><option>Downtown Venue</option><option>Charles Catering</option></select></div>
  </div>
  <div class="frow"><label>Date</label><input id="cDate" type="date" value="2026-10-15"></div>
  <div class="f2">
    <div class="frow"><label>Start</label><input id="cStart" type="time" value="17:00"></div>
    <div class="frow"><label>End</label><input id="cEnd" type="time" value="23:00"></div>
  </div>
  <div class="f2">
    <div class="frow"><label>Workers needed</label><input id="cNeed" type="number" min="1" value="4"></div>
    <div class="frow"><label>Rate ($/hr)</label><input id="cRate" type="number" min="1" value="38"></div>
  </div>
  <div class="m-actions">
    <button class="btn-ghost" onclick="saveShift(false)" style="flex:1">Save as draft</button>
    <button class="btn-primary" onclick="saveShift(true)" style="flex:1">Publish now</button>
  </div>
</div>

<div id="toast"></div>
<script>
/* ---------- data ---------- */
const ROSTER=[
 {id:'w1',name:'Marcus Bell',role:'Server',h:210,phone:'(617) 555-0142',avail:'ok'},
 {id:'w2',name:'Priya Nair',role:'Server',h:160,phone:'(617) 555-0119',avail:'ok'},
 {id:'w3',name:'Dana Whitfield',role:'Bartender',h:265,phone:'(617) 555-0177',avail:'ok'},

 {id:'w5',name:'Sofia Reyes',role:'Event Server',h:300,phone:'(617) 555-0160',avail:'ok'},

 {id:'w7',name:'Nina Petrova',role:'Server',h:190,phone:'(617) 555-0153',avail:'ok'},
 {id:'w8',name:'Tom Alvarez',role:'Prep Cook',h:45,phone:'(617) 555-0188',avail:'ok'},
];
const wById=id=>ROSTER.find(w=>w.id===id);
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtD=d=>{const[y,m,dd]=d.split('-').map(Number);const dt=new Date(y,m-1,dd);return DW[dt.getDay()]+', '+MN[m-1]+' '+dd};
const initials=n=>n.split(' ').map(x=>x[0]).join('');
const DWF=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fmtLong=d=>{const[y,m,dd]=d.split('-').map(Number);return DWF[new Date(y,m-1,dd).getDay()]+', '+MN[m-1]+' '+dd};
const fmtHdr=d=>{const[y,m,dd]=d.split('-').map(Number);const dt=new Date(y,m-1,dd);return DW[dt.getDay()]+' '+MN[m-1]+' '+dd+', '+y};
function toast(h){const t=document.getElementById('toast');t.innerHTML=h;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800)}

let UPCOMING=[
 {id:'s1',title:'Smith Wedding',role:'Event Server',date:'2026-10-10',time:'4:00 PM – 11:00 PM',loc:'State Room • Downtown Venue',rate:42,need:6,cost:'$1,764.00',c:'#8b5cf6',status:'published',staff:['w5','w6'],by:'Marcus Webb · 2h ago',ann:'Black tie. Load-in at 2 PM through the service entrance. Parking validated.'},
 {id:'s2',title:'Lunch service',role:'Server',date:'2026-10-12',time:'11:00 AM – 4:00 PM',loc:'Main Hall • Downtown Venue',rate:36,need:5,cost:'$900.00',c:'#10b981',status:'published',staff:['w1','w2','w7'],by:'Marcus Webb · yesterday',ann:'Patio open if weather holds. 86 the salmon special.'},
 {id:'s3',title:'Corporate lunch',role:'Bartender',date:'2026-10-14',time:'10:00 AM – 3:00 PM',loc:'Harbor Room • Charles Catering',rate:40,need:3,cost:'$600.00',c:'#3b82f6',status:'published',staff:['w3'],by:'Todd K. · 2 days ago',ann:'Client is Deloitte — full bar, no well drinks.'},
];
let DRAFTS=[
 {id:'d1',name:'Week of Oct 12',meta:'3 shifts · updated 2h ago',shifts:[
   {title:'Dinner service',role:'Server',date:'2026-10-13',time:'5:00 PM – 11:00 PM',loc:'Main Hall',rate:38,need:6,filled:4},
   {title:'Breakfast service',role:'Server',date:'2026-10-14',time:'7:00 AM – 12:00 PM',loc:'Main Hall',rate:34,need:3,filled:3},
   {title:'Wine tasting',role:'Sommelier',date:'2026-10-15',time:'6:00 PM – 9:00 PM',loc:'Harbor Room',rate:48,need:2,filled:1},
 ]},
 {id:'d2',name:'Halloween Gala',meta:'2 shifts · updated yesterday',shifts:[
   {title:'Gala setup',role:'Event Server',date:'2026-10-31',time:'2:00 PM – 6:00 PM',loc:'State Room',rate:42,need:6,filled:2},
   {title:'Gala service',role:'Event Server',date:'2026-10-31',time:'6:00 PM – 12:00 AM',loc:'State Room',rate:45,need:10,filled:5},
 ]},
];
const PAST=[
 {id:'p1',title:'Alden Castle Wedding',role:'Event Server',date:'2026-10-03',time:'5:00 PM – 11:00 PM',loc:'Alden Castle • Charles Catering',rate:42,need:8,cost:'$1,764.00',c:'#ec4899',staff:['w1','w2','w3','w4','w5','w6','w7']},
 {id:'p2',title:'Breakfast service',role:'Server',date:'2026-10-03',time:'7:00 AM – 12:00 PM',loc:'Main Hall • Downtown Venue',rate:34,need:3,cost:'$510.00',c:'#10b981',staff:['w1','w2','w8']},
];

/* ---------- tabs ---------- */
function switchTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  document.querySelectorAll('.tabpane').forEach(x=>x.classList.toggle('on',x.id==='tab-'+t));
}
function updateDraftBadge(){document.getElementById('draftCount').textContent=DRAFTS.length}

/* ---------- cards ---------- */
function applyFilters(){renderUpcoming();renderPast()}
function shiftCard(s,past){
  const n=s.staff.length,full=n>=s.need;
  const avs=s.staff.slice(0,3).map(wid=>{const w=wById(wid);return w?`<div class="av" style="--h:${w.h}">${initials(w.name)}</div>`:''}).join('');
  const extra=n>3?`<span class="more">+${n-3}</span>`:'';
  return `<div class="scard" onclick="openDetails('${s.id}')">
    <div class="r1"><h3>${s.title}</h3><div class="econ">${n} Pros <span>|</span> ${s.cost}</div></div>
    <div class="smeta">${fmtLong(s.date)}<br>${s.time} (EDT)<br>${s.loc} • ${s.role}</div>
    <hr>
    <div class="r2"><span class="filldot ${full?'':'part'}"></span><span class="sfill2">${n} of ${s.need} filled</span>
      <span class="astack">${avs}${extra}</span>
      <button class="linklike" onclick="event.stopPropagation();openDetails('${s.id}')">View all Pros</button>
      ${past?`<button class="linklike bookagain" onclick="event.stopPropagation();bookAgain(this,'${s.title}',${n})">↻ Book again</button>`:''}
    </div>
  </div>`;
}
function renderUpcoming(){
  const loc=document.getElementById('fLoc').value,dr=document.getElementById('fDate').value;
  let list=UPCOMING.filter(s=>!loc||s.loc.includes(loc));
  if(dr){const lim=new Date(2026,9,4);lim.setDate(lim.getDate()+ +dr);list=list.filter(s=>new Date(s.date+'T12:00')<=lim)}
  list=list.slice().sort((a,b)=>a.date.localeCompare(b.date));
  let h='',last='';
  list.forEach(s=>{if(s.date!==last){last=s.date;h+=`<div class="datehdr">${fmtHdr(s.date)}</div>`}h+=shiftCard(s,false)});
  document.getElementById('upGrid').innerHTML=h||`<div class="dempty"><div class="big">📭</div><b>Nothing upcoming</b>Published shifts will appear here.</div>`;
}
function renderPast(){
  const loc=document.getElementById('fLoc').value,dr=document.getElementById('fDate').value;
  let list=PAST.filter(s=>!loc||s.loc.includes(loc));
  if(dr){const lim=new Date(2026,9,4);lim.setDate(lim.getDate()- +dr);list=list.filter(s=>new Date(s.date+'T12:00')>=lim)}
  list=list.slice().sort((a,b)=>b.date.localeCompare(a.date));
  let h='',last='';
  list.forEach(s=>{if(s.date!==last){last=s.date;h+=`<div class="datehdr">${fmtHdr(s.date)}</div>`}h+=shiftCard(s,true)});
  document.getElementById('pastGrid').innerHTML=h;
}
function bookAgain(b,t,n){b.disabled=true;b.textContent='✓ Rebooked';toast(`<b>${t}</b> rebooked — invites sent to <b>${n} pros</b>`)}

/* ---------- drafts: sessions, not piles ---------- */
function renderDrafts(){
  updateDraftBadge();
  const el=document.getElementById('draftList');
  if(!DRAFTS.length){el.innerHTML=`<div class="dempty"><div class="big">🗂️</div><b>No drafts</b>Unpublished work lives here in tidy sessions —<br>it never piles up inside Upcoming.</div>`;return}
  el.innerHTML=DRAFTS.map(g=>{
    const open=g.shifts.reduce((a,s)=>a+(s.need-s.filled),0);
    const rows=g.shifts.map(s=>`<div class="dshift"><div class="t"><b>${s.title}</b><span>${fmtD(s.date)} · ${s.time} · ${s.role} · $${s.rate}/hr</span></div><span class="sfill">${s.filled}/${s.need} filled</span></div>`).join('');
    return `<div class="dgroup">
      <div class="dg-h" onclick="document.getElementById('gb-${g.id}').style.display=document.getElementById('gb-${g.id}').style.display==='none'?'block':'none'">
        <div><h3><span class="ddot"></span>${g.name}</h3><div class="dpsub">${g.shifts.length} shifts · ${open} open · ${g.meta}</div></div>
        <div class="dg-actions" onclick="event.stopPropagation()">
          <button class="btn-ghost" onclick="toast('Opening the schedule board…')">Continue</button>
          <button class="btn-primary sm" onclick="publishGroup('${g.id}')">Publish</button>
          <button class="btn-danger-ghost" onclick="discardGroup('${g.id}',this)">Discard</button>
        </div>
      </div>
      <div class="dg-body" id="gb-${g.id}" style="display:none">${rows}</div>
    </div>`;
  }).join('');
}
function publishGroup(id){
  const i=DRAFTS.findIndex(g=>g.id===id);if(i<0)return;
  const g=DRAFTS[i];
  g.shifts.forEach((s,k)=>UPCOMING.push({id:'n'+Date.now()+k,title:s.title,role:s.role,date:s.date,time:s.time,loc:s.loc+' • Downtown Venue',rate:s.rate,need:s.need,cost:'$'+(s.need*s.rate*5).toFixed(2),c:'#8b5cf6',status:'published',staff:[],by:'You · just now',ann:''}));
  DRAFTS.splice(i,1);renderDrafts();renderUpcoming();
  toast(`<b>${g.name}</b> published — <b>${g.shifts.length} shifts</b> live, team notified`);
  switchTab('up');
}
function discardGroup(id,btn){
  if(!btn.classList.contains('confirm')){btn.classList.add('confirm');btn.textContent='Confirm?';setTimeout(()=>{btn.classList.remove('confirm');btn.textContent='Discard'},2600);return}
  DRAFTS=DRAFTS.filter(g=>g.id!==id);renderDrafts();toast('Draft discarded');
}

/* ---------- shift details + add worker on the fly ---------- */
let curShift=null;
function openDetails(id){
  curShift=UPCOMING.find(s=>s.id===id)||PAST.find(s=>s.id===id);if(!curShift)return;
  renderDetails();
  document.getElementById('detailsOv').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeDetails(){document.getElementById('detailsOv').classList.remove('open');document.body.style.overflow='';curShift=null}
function renderDetails(){
  const s=curShift,n=s.staff.length,pct=Math.round(n/s.need*100),full=n>=s.need;
  const isDraft=s.status==='draft';
  const canModify=UPCOMING.some(x=>x.id===s.id);
  const pill=isDraft?'<span class="pill dft">DRAFT</span>':'<span class="pill pub">PUBLISHED</span>';
  const mapSvg=`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`;
  const wrows=s.staff.map(wid=>{const w=wById(wid);return `<tr>
      <td><div class="tname"><div class="av">${initials(w.name)}</div><div><b>${w.name}</b><span>${w.role} · $${s.rate}/hr</span></div></div></td>
      <td><span class="tbox">–</span></td><td><span class="tbox">–</span></td><td><span class="tbox">30 min</span></td>
      <td class="tact"><button class="mapbtn" onclick="toast('Opening map…')" title="Directions">${mapSvg}</button></td>
    </tr>`}).join('');
  let slotrows='';if(canModify)for(let i=n;i<s.need;i++)slotrows+=`<tr class="tslot"><td colspan="5"><div class="slotin" onclick="openPicker()"><div class="av empty">+</div><div><b>Open slot</b><div class="ssub">${s.role} · tap to add someone</div></div><span style="flex:1"></span><button class="btn-primary sm" onclick="event.stopPropagation();openPicker()">＋ Add</button></div></td></tr>`;
  const staffBlock=`
    <div class="d-sec-h"><h3>Staffing · ${n}/${s.need}</h3>${canModify?`<button class="btn-primary sm" onclick="openPicker()">＋ Add worker</button>`:''}</div>
    <div class="twrap"><table class="rostertbl">
      <thead><tr><th>Name</th><th>Clock-in</th><th>Clock-out</th><th>Total unpaid break</th><th></th></tr></thead>
      <tbody>${wrows}${slotrows}</tbody>
    </table></div>
    ${full?'<p style="margin-top:12px;font-size:13px;color:var(--muted)">Fully staffed ✓</p>':''}`;
  document.getElementById('detailsBody').innerHTML=`
    <div class="d-head">${pill}<h2>${s.title}</h2>
      <div class="d-meta">${fmtLong(s.date)} · ${s.time} (EDT)<br>${s.loc}<br>${s.role} · $${s.rate}/hr</div>
      <div class="d-econ">${n} Pros <span>|</span> ${s.cost} <span>estimated</span></div></div>
    <div class="d-sec">${staffBlock}</div>
    ${s.ann?`<div class="d-sec"><h3>Announcements</h3><p>${s.ann}</p></div>`:''}
    <div class="d-sec"><h3>Details</h3><p>Created by ${s.by||'—'}<br>Break: 30 min unpaid · Clock-in opens 15 min early</p></div>
    <div class="d-actions">
      <button class="btn-ghost" onclick="toast('Editing shift…')">Edit</button>
      <button class="btn-ghost" onclick="toast('Duplicated as a draft — see the Drafts tab')">Duplicate</button>
      ${canModify?`<button class="btn-danger-ghost danger" id="delShift" onclick="deleteShift(this)">Delete</button>`:''}
    </div>`;
}
function deleteShift(btn){
  if(!btn.classList.contains('confirm')){btn.classList.add('confirm');btn.textContent='Confirm delete?';return}
  UPCOMING=UPCOMING.filter(s=>s.id!==curShift.id);
  closeDetails();renderUpcoming();toast('Shift deleted');
}

/* ---------- roster picker ---------- */
let pkRole='All';
function openPicker(){
  if(curShift.staff.length>=curShift.need){toast('Shift is fully staffed');return}
  document.getElementById('pkSub').textContent=`${curShift.title} · ${fmtD(curShift.date)} — pick anyone, they're on the shift instantly`;
  document.getElementById('pkSearch').value='';pkRole='All';renderPickerFilters();renderPicker();
  document.getElementById('scrim').classList.add('open');
  document.getElementById('picker').classList.add('open');
}
function closePicker(){document.getElementById('scrim').classList.remove('open');document.getElementById('picker').classList.remove('open')}
function renderPickerFilters(){
  const roles=['All',...new Set(ROSTER.map(w=>w.role))];
  document.getElementById('pkFilters').innerHTML=roles.map(r=>`<button class="fchip ${r===pkRole?'on':''}" onclick="pkRole='${r}';renderPickerFilters();renderPicker()">${r}</button>`).join('');
}
function renderPicker(){
  const q=document.getElementById('pkSearch').value.toLowerCase();
  const onShift=new Set(curShift?curShift.staff:[]);
  const list=ROSTER.filter(w=>(pkRole==='All'||w.role===pkRole)&&w.name.toLowerCase().includes(q)&&!onShift.has(w.id));
  document.getElementById('pkList').innerHTML=list.map(w=>`
    <div class="prow" onclick="assignWorker('${w.id}')">
      <div class="av" style="--h:${w.h}">${initials(w.name)}</div>
      <div class="sinfo"><b>${w.name}</b><span>${w.role} · ${w.phone}</span></div>
      ${w.avail==='ok'?'<span class="avail ok">Available</span>':`<span class="avail warn">⚠ ${w.note}</span>`}
    </div>`).join('')||'<div class="dempty" style="border:none"><b>No matches</b>Try a different search or role.</div>';
}
function assignWorker(wid){
  const w=wById(wid);
  curShift.staff.push(wid);
  closePicker();renderDetails();renderUpcoming();
  const n=curShift.staff.length;
  toast(w.avail==='ok'
    ?`<b>${w.name}</b> added to <b>${curShift.title}</b> · ${n}/${curShift.need} filled`
    :`<b>${w.name}</b> added · ⚠ overlaps ${w.note}`);
}

/* ---------- quick create ---------- */
function openCreate(){document.getElementById('scrim2').classList.add('open');document.getElementById('createModal').classList.add('open')}
function closeCreate(){document.getElementById('scrim2').classList.remove('open');document.getElementById('createModal').classList.remove('open')}
function t12(t){let[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(m).padStart(2,'0')} ${ap}`}
function saveShift(publish){
  const title=document.getElementById('cTitle').value.trim()||'Untitled shift';
  const role=document.getElementById('cRole').value,loc=document.getElementById('cLoc').value;
  const date=document.getElementById('cDate').value||'2026-10-15';
  const time=t12(document.getElementById('cStart').value||'17:00')+' – '+t12(document.getElementById('cEnd').value||'23:00');
  const need=Math.max(1,+document.getElementById('cNeed').value||1),rate=Math.max(1,+document.getElementById('cRate').value||38);
  const s={id:'n'+Date.now(),title,role,date,time,loc:loc==='Downtown Venue'?'TBD • Downtown Venue':'TBD • Charles Catering',rate,need,cost:'$'+(need*rate*5).toFixed(2),c:'#8b5cf6',staff:[],by:'You · just now',ann:''};
  closeCreate();
  if(publish){s.status='published';UPCOMING.push(s);renderUpcoming();switchTab('up');toast(`<b>${title}</b> published — team notified`)}
  else{s.status='draft';DRAFTS.unshift({id:'d'+Date.now(),name:title,meta:'1 shift · just now',shifts:[{title,role,date,time,loc:loc,rate,need,filled:0}]});renderDrafts();switchTab('drafts');toast(`Draft saved — <b>${title}</b> is in the Drafts tab`)}
}

renderUpcoming();renderDrafts();renderPast();
</script>
</body>
</html>
